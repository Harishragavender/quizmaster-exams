        ["allResults", "clipboard-list", "Student results"]
      ];
      const nav = currentUser.role === "admin" ? adminNav : studentNav;
      return `
        <aside class="sidebar">
          <button type="button" class="brand" data-action="navigate" data-page="dashboard" style="border:0;background:transparent;text-align:left">
            <div class="brand-mark">${icon("graduation-cap")}</div><span class="brand-name">QuizMaster</span>
          </button>
          <div class="sidebar-nav-label">${currentUser.role === "admin" ? "Administration" : "Student workspace"}</div>
          <nav class="sidebar-nav">
            ${nav.map(([page, iconName, label]) => `
              <button type="button" class="nav-item ${sidebarActive(page) ? "active" : ""}" data-action="navigate" data-page="${page}">
                ${icon(iconName)}<span>${label}</span>${page === "browse" ? `<span class="nav-badge">${publishedQuizzes().length}</span>` : ""}
              </button>`).join("")}
          </nav>
          <div class="sidebar-spacer"></div>
          <div class="sidebar-help">
            <div class="sidebar-help-icon">${icon("help-circle")}</div>
            <strong>Need a quick guide?</strong>
            <p>Learn about navigation, timing and exam submissions.</p>
            <button type="button" data-action="open-help">Open exam guide ${icon("arrow-up-right")}</button>
          </div>
          <div class="sidebar-user">
            <div class="avatar">${initials(currentUser.name)}</div>
            <div class="sidebar-user-info"><strong>${esc(currentUser.name)}</strong><span>${esc(currentUser.role)}</span></div>
            <button type="button" class="icon-btn" data-action="logout" title="Log out" aria-label="Log out">${icon("log-out")}</button>
          </div>
        </aside>
        <div class="sidebar-scrim" data-action="close-sidebar"></div>`;
    }

    function renderTopbar() {
      const unread = notices().filter(item => item.createdAt > (currentUser.notificationsReadAt || 0)).length;
      return `
        <header class="topbar">
          <div class="topbar-left">
            <button type="button" class="icon-btn mobile-menu" data-action="mobile-menu" aria-label="Open navigation">${icon("menu")}</button>
            <span class="topbar-title">${esc(pageTitle())}</span>
          </div>
          <form class="topbar-search" id="global-search-form">
            ${icon("search")}<input name="search" aria-label="Search quizzes" placeholder="${currentUser.role === "admin" ? "Search quiz library..." : "Search quizzes, subjects..."}" autocomplete="off">
          </form>
          <div class="top-actions">
            <button type="button" class="icon-btn notification-btn" data-action="toggle-notifications" aria-label="Notifications">${icon("bell")}${unread ? `<span class="notification-dot">${Math.min(unread, 9)}</span>` : ""}</button>
            <div class="top-profile"><div class="avatar">${initials(currentUser.name)}</div><div class="top-profile-text"><strong>${esc(currentUser.name)}</strong><span>${esc(currentUser.role)}</span></div></div>
            ${renderNotificationPanel()}
          </div>
        </header>`;
    }

    function renderApp() {
      if (!currentUser) return renderAuth();
      clearInterval(examTimer);
      examTimer = null;
      document.title = `${pageTitle()} • QuizMaster`;
      let content = "";
      switch (state.view) {
        case "browse": content = renderBrowse(); break;
        case "instructions": content = renderInstructions(); break;
        case "results": content = renderResults(); break;
        case "result": content = renderResult(); break;
        case "review": content = renderReview(); break;
        case "manage": content = currentUser.role === "admin" ? renderManage() : renderStudentDashboard(); break;
        case "allResults": content = currentUser.role === "admin" ? renderAllResults() : renderStudentDashboard(); break;
        case "quizEditor": content = currentUser.role === "admin" ? renderQuizEditor() : renderStudentDashboard(); break;
        default: content = currentUser.role === "admin" ? renderAdminDashboard() : renderStudentDashboard();
      }
      app.innerHTML = `
        <div class="app-shell ${state.sidebarOpen ? "sidebar-open" : ""}">
          ${renderSidebar()}
          <div class="app-main">${renderTopbar()}<main class="page-content">${content}</main></div>
        </div>`;
      refreshIcons();
    }

    function navigate(page) {
      if (!currentUser) return;
      if (["manage", "allResults", "quizEditor"].includes(page) && !requireAdmin()) return;
      if (currentUser.role === "admin" && ["browse", "instructions", "results", "result"].includes(page)) page = "dashboard";
      state.view = page;
      state.notificationsOpen = false;
      state.sidebarOpen = false;
      closeModal();
      window.scrollTo({ top: 0, behavior: "smooth" });
      renderApp();
    }

    function statCard(iconName, color, label, value, foot) {
      return `<div class="card stat-card"><div class="stat-icon ${color}">${icon(iconName)}</div><div class="stat-info"><div class="label">${esc(label)}</div><div class="stat-value">${esc(value)}</div><div class="stat-foot">${esc(foot)}</div></div></div>`;
    }

    function renderResumeStrip() {
      const active = loadActive();
      if (!active || currentUser.role !== "student") return "";
      const quiz = getQuiz(active.quizId);
      if (!quiz) return "";
      return `<div class="resume-strip"><div class="resume-icon">${icon("timer")}</div><div class="resume-copy"><strong>You have an exam in progress</strong><span>${esc(quiz.title)} · Your answers are saved, but the countdown is still running.</span></div><button type="button" class="btn btn-primary btn-sm" data-action="resume-exam">Resume exam ${icon("arrow-right")}</button></div>`;
    }

    function renderStudentDashboard() {
      const attempts = userAttempts();
      const average = attempts.length ? attempts.reduce((sum, attempt) => sum + attempt.percentage, 0) / attempts.length : 0;
      const points = attempts.reduce((sum, attempt) => sum + attempt.score, 0);
      const time = attempts.reduce((sum, attempt) => sum + attempt.timeUsed, 0);
      const quizzes = publishedQuizzes().slice(0, 3);
      const firstName = currentUser.name.split(" ")[0];
      const featured = publishedQuizzes().find(quiz => !attempts.some(attempt => attempt.quizId === quiz.id)) || publishedQuizzes()[0];
      const today = new Intl.DateTimeFormat("en", { weekday: "long", day: "numeric", month: "long" }).format(new Date());

      return `
        <div class="welcome-row"><div><h1>Good ${new Date().getHours() < 12 ? "morning" : new Date().getHours() < 18 ? "afternoon" : "evening"}, ${esc(firstName)}.</h1><p>Here is what is happening with your learning today.</p></div><div class="date-chip">${icon("calendar")} ${today}</div></div>
        ${renderResumeStrip()}
        <section class="dashboard-hero">
          <div class="hero-copy"><div class="eyebrow">Your next achievement awaits</div><h2>Turn your preparation into a performance you are proud of.</h2><p>${featured ? `Recommended for you: ${esc(featured.title)} · ${featured.questions.length} questions · ${featured.duration} minutes.` : "Explore the quiz library and begin your first assessment."}</p><button type="button" class="btn" data-action="${featured ? "instructions" : "navigate"}" ${featured ? `data-id="${featured.id}"` : 'data-page="browse"'}>Take a quiz ${icon("arrow-right")}</button></div>
          <div class="hero-image"><img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=900&q=80" alt="Students learning together"><div class="hero-floating"><div class="hero-floating-icon">${icon("trending-up")}</div><div><strong>${attempts.length ? `${Math.round(average)}% average score` : "Start your progress"}</strong><span>${attempts.length >= 2 ? "Performance tracked over time" : "Complete quizzes to build insights"}</span></div></div></div>
        </section>
        <section class="stats-grid">
          ${statCard("clipboard-check", "purple", "Exams completed", attempts.length, `${publishedQuizzes().length} quizzes available`)}
          ${statCard("target", "green", "Average score", `${Math.round(average)}%`, attempts.length ? "Across all submissions" : "Complete your first exam")}
          ${statCard("award", "amber", "Marks earned", formatNumber(points), "Total across all quizzes")}
          ${statCard("clock", "blue", "Exam time", readableTime(time), "Focused assessment time")}
        </section>
        <section class="dashboard-grid">
          ${renderPerformanceChart(attempts)}
          ${renderMastery(attempts)}
        </section>
        <section class="dashboard-quizzes">
          <div class="section-head"><div><h2>Available quizzes</h2><p>Choose your next challenge from the library.</p></div><button type="button" class="section-link" data-action="navigate" data-page="browse">View all ${icon("arrow-right")}</button></div>
          <div class="quiz-grid">${quizzes.map(renderQuizCard).join("")}</div>
        </section>
        <section>
          <div class="section-head"><div><h2>Recent results</h2><p>Review your latest exam performance.</p></div>${attempts.length ? `<button type="button" class="section-link" data-action="navigate" data-page="results">All results ${icon("arrow-right")}</button>` : ""}</div>
          ${renderRecentResults(attempts.slice(0, 4), false)}
        </section>`;
    }

    function renderPerformanceChart(attempts) {
      const data = [...attempts].sort((a, b) => a.submittedAt - b.submittedAt).slice(-6);
      if (!data.length) {
        return `<div class="card chart-card"><div class="section-head"><div><h2>Performance overview</h2><p>Your latest examination scores.</p></div></div><div class="empty-state" style="padding:28px 15px"><div class="empty-icon">${icon("bar-chart-3")}</div><h3>Your progress starts here</h3><p>Complete an exam and your score trend will appear in this chart.</p><button type="button" class="btn btn-secondary btn-sm" data-action="navigate" data-page="browse">Browse quizzes</button></div></div>`;
      }
      const width = 650, height = 220, left = 35, right = 15, top = 16, bottom = 35;
      const chartW = width - left - right, chartH = height - top - bottom;
      const points = data.map((attempt, index) => {
        const x = left + (data.length === 1 ? chartW / 2 : index * chartW / (data.length - 1));
        const y = top + chartH - (attempt.percentage / 100) * chartH;
        return { x, y, attempt };
      });
      const line = points.map(point => `${point.x},${point.y}`).join(" ");
      const area = points.length ? `M ${points[0].x} ${top + chartH} L ${points.map(point => `${point.x} ${point.y}`).join(" L ")} L ${points[points.length - 1].x} ${top + chartH} Z` : "";
      return `
        <div class="card chart-card">
          <div class="section-head"><div><h2>Performance overview</h2><p>Your latest examination scores.</p></div><span class="chart-legend">Score percentage</span></div>
          <svg class="performance-chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-label="Exam performance line chart">
            <defs><linearGradient id="chartArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6c5dde" stop-opacity=".24"/><stop offset="100%" stop-color="#6c5dde" stop-opacity="0"/></linearGradient></defs>
            ${[0, 25, 50, 75, 100].map(value => {
              const y = top + chartH - (value / 100) * chartH;
              return `<line x1="${left}" y1="${y}" x2="${width - right}" y2="${y}" stroke="#ececf2" stroke-width="1"/><text x="0" y="${y + 4}" fill="#98a2b3" font-size="10" font-family="DM Sans">${value}%</text>`;
            }).join("")}
            <path d="${area}" fill="url(#chartArea)"/>
            <polyline points="${line}" fill="none" stroke="#5b50d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
            ${points.map(point => `<g><circle cx="${point.x}" cy="${point.y}" r="5" fill="#fff" stroke="#5b50d6" stroke-width="3" vector-effect="non-scaling-stroke"><title>${esc(point.attempt.quizTitle)}: ${point.attempt.percentage}%</title></circle><text x="${point.x}" y="${height - 8}" text-anchor="middle" fill="#8c94a5" font-size="9" font-family="DM Sans">${new Intl.DateTimeFormat("en", { day: "numeric", month: "short" }).format(new Date(point.attempt.submittedAt))}</text></g>`).join("")}
          </svg>
        </div>`;
    }

    function renderMastery(attempts) {
      const subjects = [...new Set(db.quizzes.map(quiz => quiz.subject))].slice(0, 4);
      const colors = ["", "green", "amber", ""];
      return `<div class="card mastery-card"><div class="section-head"><div><h2>Subject mastery</h2><p>Average result by subject.</p></div>${icon("brain")}</div><div class="mastery-list">${subjects.map((subject, index) => {
        const relevant = attempts.filter(attempt => attempt.subject === subject);
        const value = relevant.length ? Math.round(relevant.reduce((sum, attempt) => sum + attempt.percentage, 0) / relevant.length) : 0;
        return `<div><div class="mastery-top"><span>${esc(subject)}</span><span>${relevant.length ? `${value}%` : "Not attempted"}</span></div><div class="progress-track"><div class="progress-fill ${colors[index]}" style="width:${value}%"></div></div></div>`;
      }).join("")}</div></div>`;
    }

    function renderQuizCard(quiz) {
      const attempts = userAttempts().filter(attempt => attempt.quizId === quiz.id);
      const best = attempts.length ? Math.max(...attempts.map(attempt => attempt.percentage)) : null;
      return `
        <article class="card quiz-card">
          <div class="quiz-cover" style="background-image:url('${safeCover(quiz.cover)}')"><span class="subject-chip">${esc(quiz.subject)}</span><span class="badge badge-${esc(quiz.difficulty.toLowerCase())}">${esc(quiz.difficulty)}</span></div>
          <div class="quiz-body">
            <div class="quiz-category">${esc(quiz.category)}</div>
            <h3 class="quiz-title">${esc(quiz.title)}</h3>
            <p class="quiz-description">${esc(quiz.description)}</p>
            <div class="quiz-meta"><span>${icon("list-checks")} ${quiz.questions.length} questions</span><span>${icon("clock")} ${quiz.duration} min</span><span>${icon("award")} ${formatNumber(quiz.totalMarks)} marks</span></div>
            <div class="quiz-footer"><div class="quiz-marks">${best !== null ? `Best score<strong>${best}%</strong>` : `Passing score<strong>${quiz.passPercentage}%</strong>`}</div><button type="button" class="btn ${attempts.length ? "btn-outline" : "btn-primary"} btn-sm" data-action="instructions" data-id="${quiz.id}">${attempts.length ? "Retake quiz" : "View quiz"} ${icon("arrow-right")}</button></div>
          </div>
        </article>`;
    }

    function filteredQuizzes() {
      const filter = state.filters;
      const search = filter.search.trim().toLowerCase();
      return publishedQuizzes().filter(quiz => {
        const matchesSearch = !search || [quiz.title, quiz.description, quiz.subject, quiz.category].some(value => value.toLowerCase().includes(search));
        return matchesSearch &&
          (filter.subject === "All" || quiz.subject === filter.subject) &&
          (filter.difficulty === "All" || quiz.difficulty === filter.difficulty) &&
          (filter.category === "All" || quiz.category === filter.category);
      });
    }

    function renderQuizGrid() {
      const quizzes = filteredQuizzes();
      return quizzes.length ? quizzes.map(renderQuizCard).join("") : `<div class="card empty-state" style="grid-column:1/-1"><div class="empty-icon">${icon("search-x")}</div><h3>No quizzes found</h3><p>Try changing your search term or clearing the selected filters.</p><button type="button" class="btn btn-secondary" data-action="clear-filters">Clear all filters</button></div>`;
    }

    function renderBrowse() {
      const subjects = [...new Set(publishedQuizzes().map(quiz => quiz.subject))];
      const categories = [...new Set(publishedQuizzes().map(quiz => quiz.category))];
      return `
        <div class="page-title-row"><div><h1>Explore the quiz library</h1><p>Find an assessment by subject, category or difficulty.</p></div><div class="page-actions"><span class="badge badge-neutral">${publishedQuizzes().length} published quizzes</span></div></div>
        <div class="card filter-bar">
          <div class="filter-search">${icon("search")}<input class="input" data-quiz-search value="${esc(state.filters.search)}" placeholder="Search quizzes..." aria-label="Search quizzes"></div>
          <select class="select" data-filter="difficulty" aria-label="Filter by difficulty"><option value="All">All difficulties</option>${["Easy", "Medium", "Hard"].map(value => `<option ${state.filters.difficulty === value ? "selected" : ""}>${value}</option>`).join("")}</select>
          <select class="select" data-filter="category" aria-label="Filter by category"><option value="All">All categories</option>${categories.map(value => `<option ${state.filters.category === value ? "selected" : ""}>${esc(value)}</option>`).join("")}</select>
        </div>
        <div class="subject-tabs"><button type="button" class="subject-tab ${state.filters.subject === "All" ? "active" : ""}" data-action="set-subject" data-subject="All">All subjects</button>${subjects.map(subject => `<button type="button" class="subject-tab ${state.filters.subject === subject ? "active" : ""}" data-action="set-subject" data-subject="${esc(subject)}">${esc(subject)}</button>`).join("")}</div>
        <div class="results-count" id="quiz-results-count">Showing ${filteredQuizzes().length} of ${publishedQuizzes().length} quizzes</div>
        <div class="quiz-grid" id="quiz-grid">${renderQuizGrid()}</div>`;
    }

    function updateQuizGrid() {
      const grid = document.getElementById("quiz-grid");
      const count = document.getElementById("quiz-results-count");
      if (grid) grid.innerHTML = renderQuizGrid();
      if (count) count.textContent = `Showing ${filteredQuizzes().length} of ${publishedQuizzes().length} quizzes`;
      refreshIcons();
    }

    function renderInstructions() {
      const quiz = getQuiz(state.selectedQuizId);
      if (!quiz || quiz.status !== "published" || currentUser.role !== "student") {
        return `<div class="card empty-state"><div class="empty-icon">${icon("file-question")}</div><h3>Quiz unavailable</h3><p>This quiz is no longer published or could not be found.</p><button type="button" class="btn btn-primary" data-action="navigate" data-page="browse">Back to quiz library</button></div>`;
      }
      const attempts = userAttempts().filter(attempt => attempt.quizId === quiz.id);
      const best = attempts.length ? Math.max(...attempts.map(attempt => attempt.percentage)) : null;
      return `
        <div class="breadcrumb"><button type="button" data-action="navigate" data-page="browse">${icon("arrow-left")} Quiz library</button>${icon("chevron-right")}<span>Instructions</span></div>
        <div class="instructions-layout">
          <section class="card instruction-main">
            <div class="instruction-banner" style="background-image:url('${safeCover(quiz.cover)}')"><div class="instruction-banner-content"><span class="badge badge-${quiz.difficulty.toLowerCase()}">${esc(quiz.difficulty)}</span><h1>${esc(quiz.title)}</h1></div></div>
            <div class="instruction-content">
              <div class="instruction-stats">
                <div class="instruction-stat">${icon("list-checks")}<div><strong>${quiz.questions.length}</strong><span>Questions</span></div></div>
                <div class="instruction-stat">${icon("clock")}<div><strong>${quiz.duration} min</strong><span>Time limit</span></div></div>
                <div class="instruction-stat">${icon("award")}<div><strong>${formatNumber(quiz.totalMarks)}</strong><span>Total marks</span></div></div>
                <div class="instruction-stat">${icon("target")}<div><strong>${quiz.passPercentage}%</strong><span>Passing score</span></div></div>
              </div>
              <h2>Examination instructions</h2>
              <ul class="rules-list">
                <li><span class="rule-number">01</span><span>The exam contains <strong>${quiz.questions.length} multiple-choice questions</strong>. Each question has one correct answer.</span></li>
                <li><span class="rule-number">02</span><span>Your countdown begins as soon as you start. The examination will be <strong>submitted automatically</strong> when time expires.</span></li>
                <li><span class="rule-number">03</span><span>Use Previous, Next and the question palette to move freely. You may mark questions for review before submitting.</span></li>
                <li><span class="rule-number">04</span><span>There is no negative marking. Unanswered questions receive zero marks and all scoring is calculated after submission.</span></li>
                <li><span class="rule-number">05</span><span>Do not refresh or close your browser unnecessarily. Your selected answers are saved, but the timer continues if you leave.</span></li>
              </ul>
              <div class="instructions-agree"><label class="checkbox-row"><input type="checkbox" id="instructions-check"><span>I have read the instructions and I am ready to begin the ${quiz.duration}-minute examination.</span></label></div>
              <button type="button" class="btn btn-primary btn-lg w-full" id="start-exam-btn" data-action="start-exam" data-id="${quiz.id}" disabled>${attempts.length ? "Start retake" : "Start examination"} ${icon("arrow-right")}</button>
            </div>
          </section>
          <aside class="card instruction-side">
            <h3>Before you begin</h3>
            <div class="before-list">
              <div class="before-item">${icon("check-circle-2")}<span>Use a stable internet connection and an up-to-date browser.</span></div>
              <div class="before-item">${icon("check-circle-2")}<span>Find a quiet place where you can complete the exam without interruption.</span></div>
              <div class="before-item">${icon("check-circle-2")}<span>Keep track of the timer shown at the top of the examination screen.</span></div>
            </div>
            ${best !== null ? `<div class="best-attempt"><span>Your previous best</span><strong>${best}%</strong><span>${attempts.length} attempt${attempts.length > 1 ? "s" : ""} completed</span></div>` : `<div class="best-attempt"><span>First attempt</span><strong style="font-size:16px">You have got this</strong><span>Your result will be available instantly.</span></div>`}
            <div class="publish-note">${icon("shield-check")}<span>Answer keys remain protected until your examination has been submitted successfully.</span></div>
          </aside>
        </div>`;
    }

    function openInstructions(quizId) {
      if (currentUser.role !== "student") return toast("Administrators can manage quizzes from the admin dashboard.", "warning");
      const quiz = getQuiz(quizId);
      if (!quiz || quiz.status !== "published") return toast("This quiz is not currently available.", "error");
      state.selectedQuizId = quizId;
      navigate("instructions");
    }

    function beginExam(quizId) {
      const quiz = getQuiz(quizId);
      if (!quiz || quiz.status !== "published" || currentUser.role !== "student") {
        return toast("The examination could not be started because the quiz is unavailable.", "error", "Unable to start");
      }
      const existing = loadActive();
      if (existing) {
        const existingQuiz = getQuiz(existing.quizId);
        openModal(`
          ${modalHeader("Exam already in progress")}
          <div class="modal-body"><div class="modal-icon warning">${icon("timer")}</div><p>You already have <strong style="color:var(--ink)">${esc(existingQuiz?.title || "an examination")}</strong> in progress. Its timer is still running.</p><p>Resume it now, or discard the saved answers and start the new examination.</p></div>
          <div class="modal-actions"><button type="button" class="btn btn-danger" data-action="discard-and-start" data-id="${quizId}">Discard & start new</button><button type="button" class="btn btn-primary" data-action="resume-exam">Resume exam</button></div>`);
        return;
      }
      const now = Date.now();
      currentActive = {
        id: uid("active"), userId: currentUser.id, quizId,
        startedAt: now, endTime: now + Number(quiz.duration) * 60000,
        responses: {}, marked: [], current: 0
      };
      saveActive();
      sessionStorage.setItem(EXAM_FLAG, currentUser.id);
      state.view = "exam";
      renderExam();
      startExamTimer();
      toast("Your timer has started. Good luck!", "success", "Examination started");
    }

    function resumeExam() {
      const active = loadActive();
      if (!active) {
        closeModal();
        return toast("No active examination was found.", "warning");
      }
      currentActive = active;
      closeModal();
      if (active.endTime <= Date.now()) {
        state.view = "exam";
        submitExam(true);
        return;
      }
      state.view = "exam";
      sessionStorage.setItem(EXAM_FLAG, currentUser.id);
      renderExam();
      startExamTimer();
    }

    function examData() {
      if (!currentActive || currentActive.userId !== currentUser?.id || currentUser?.role !== "student") return null;
      const quiz = getQuiz(currentActive.quizId);
      if (!quiz) return null;
      return {
        quiz,
        questions: quiz.questions.map(question => ({
          id: question.id, text: question.text, options: [...question.options], marks: question.marks
        }))
      };
    }

    function answeredCount() {
      const data = examData();
      if (!data) return 0;
      return data.questions.filter(question => {
        const response = currentActive.responses[question.id];
        return Number.isInteger(response) && response >= 0 && response < question.options.length;
      }).length;
    }

    function renderExam() {
      const data = examData();
      if (!data) {
        state.view = "dashboard";
        currentActive = null;
        renderApp();
        toast("The active examination could not be restored.", "error");
        return;
      }
      document.title = `${formatDuration((currentActive.endTime - Date.now()) / 1000)} • ${data.quiz.title}`;
      const { quiz, questions } = data;
      const index = Math.max(0, Math.min(currentActive.current || 0, questions.length - 1));
      currentActive.current = index;
      const question = questions[index];
      const selected = currentActive.responses[question.id];
      const answered = answeredCount();
      const progress = questions.length ? Math.round(answered / questions.length * 100) : 0;
      const isMarked = currentActive.marked.includes(question.id);
      app.innerHTML = `
        <div class="exam-shell">
          <header class="exam-topbar">
            <div class="brand"><div class="brand-mark">${icon("graduation-cap")}</div><span class="brand-name">QuizMaster</span></div>
            <div class="exam-divider"></div>
            <div class="exam-title"><strong>${esc(quiz.title)}</strong><span>${esc(quiz.subject)} · ${formatNumber(quiz.totalMarks)} total marks</span></div>
            <div class="save-state">${icon("cloud-check")} Answers saved</div>
            <div class="exam-timer" data-timer-container>${icon("timer")}<div><span class="exam-timer-label">Time left</span><strong data-timer>--:--</strong></div></div>
            <button type="button" class="btn btn-outline btn-sm" data-action="exit-exam">${icon("log-out")} Save & exit</button>
          </header>
          <div class="exam-layout">
            <main class="exam-main">
              <div class="exam-progress-head"><span>Question <strong>${index + 1}</strong> of ${questions.length}</span><span>${answered} answered · ${progress}% complete</span></div>
              <div class="exam-progress"><div class="exam-progress-fill" style="width:${progress}%"></div></div>
              <section class="card question-card">
                <div class="question-top"><span class="question-number">Question ${String(index + 1).padStart(2, "0")}</span><div class="question-tools"><span class="marks-chip">${formatNumber(question.marks)} mark${Number(question.marks) === 1 ? "" : "s"}</span><button type="button" class="review-flag ${isMarked ? "active" : ""}" data-action="toggle-review">${icon("flag")}<span>${isMarked ? "Marked for review" : "Mark for review"}</span></button></div></div>
                <h1 class="question-text">${esc(question.text)}</h1>
                <div class="options-list" role="radiogroup" aria-label="Answer options">
                  ${question.options.map((option, optionIndex) => `
                    <button type="button" class="option-btn ${selected === optionIndex ? "selected" : ""}" data-action="select-option" data-index="${optionIndex}" role="radio" aria-checked="${selected === optionIndex}">
                      <span class="option-letter">${String.fromCharCode(65 + optionIndex)}</span><span class="option-text">${esc(option)}</span><span class="option-check">${icon("check")}</span>
                    </button>`).join("")}
                </div>
                <div class="question-actions">
                  <button type="button" class="btn btn-outline" data-action="prev-question" ${index === 0 ? "disabled" : ""}>${icon("arrow-left")} Previous</button>
                  <button type="button" class="clear-answer" data-action="clear-answer" ${selected === undefined ? "disabled" : ""}>Clear answer</button>
                  <div class="question-actions-right"><span class="tiny subtle">Press ${index + 1 === questions.length ? "submit when ready" : "→ for next"}</span><button type="button" class="btn btn-primary" data-action="next-question" ${index === questions.length - 1 ? "disabled" : ""}>Next ${icon("arrow-right")}</button></div>
                </div>
              </section>
            </main>
            <aside class="exam-sidebar">
              <section class="card palette-card">
                <h3>Question navigation</h3><div class="palette-subtitle">Select a number to jump to that question.</div>
                <div class="question-palette">
                  ${questions.map((item, itemIndex) => {
                    const isAnswered = currentActive.responses[item.id] !== undefined;
                    const marked = currentActive.marked.includes(item.id);
                    return `<button type="button" class="q-dot ${isAnswered ? "answered" : ""} ${marked ? "marked" : ""} ${itemIndex === index ? "current" : ""}" data-action="jump-question" data-index="${itemIndex}" aria-label="Question ${itemIndex + 1}${isAnswered ? ", answered" : ""}">${itemIndex + 1}</button>`;
                  }).join("")}
                </div>
                <div class="palette-legend"><span class="legend-item"><i class="legend-dot answered"></i>Answered</span><span class="legend-item"><i class="legend-dot"></i>Not answered</span><span class="legend-item"><i class="legend-dot marked"></i>For review</span><span class="legend-item"><i class="legend-dot current"></i>Current</span></div>
              </section>
              <section class="card submit-card">
                <div class="submit-summary"><div class="submit-stat"><strong>${answered}</strong><span>Answered</span></div><div class="submit-stat"><strong>${questions.length - answered}</strong><span>Remaining</span></div></div>
                <button type="button" class="btn btn-primary w-full" data-action="confirm-submit">${icon("send")} Submit examination</button>
                <p class="submit-note">${icon("shield-check")}Your score will be calculated securely after submission.</p>
              </section>
            </aside>
          </div>
        </div>`;
      updateTimerDisplay();
      refreshIcons();
    }

    function startExamTimer() {
      clearInterval(examTimer);
      updateTimerDisplay();
      examTimer = setInterval(updateTimerDisplay, 500);
    }

    function updateTimerDisplay() {
      if (!currentActive || state.view !== "exam") return;
      const remaining = Math.max(0, Math.ceil((currentActive.endTime - Date.now()) / 1000));
      document.querySelectorAll("[data-timer]").forEach(element => element.textContent = formatDuration(remaining));
      document.querySelectorAll("[data-timer-container]").forEach(element => {
        element.classList.toggle("warning", remaining <= 300 && remaining > 60);
        element.classList.toggle("danger", remaining <= 60);
      });
      document.title = `${formatDuration(remaining)} • QuizMaster Exam`;
      if (remaining <= 0 && !submitting) {
        clearInterval(examTimer);
        examTimer = null;
        submitExam(true);
      }
    }

    function selectOption(optionIndex) {
      const data = examData();
      if (!data) return;
      const question = data.questions[currentActive.current];
      if (optionIndex < 0 || optionIndex >= question.options.length) return;
      currentActive.responses[question.id] = optionIndex;
      saveActive();
      renderExam();
    }

    function goToQuestion(index) {
      const data = examData();
      if (!data) return;
      const next = Math.max(0, Math.min(index, data.questions.length - 1));
      currentActive.current = next;
      saveActive();
      renderExam();
      if (window.innerWidth < 720) window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function confirmSubmitExam() {
      const data = examData();
      if (!data) return;
      const answered = answeredCount();
      const unanswered = data.questions.length - answered;
      openModal(`
        ${modalHeader("Submit examination?")}
        <div class="modal-body"><div class="modal-icon">${icon("send")}</div><p>Once submitted, you cannot change your answers. Your marks and result will be calculated immediately.</p><div class="modal-stats"><div class="modal-stat"><strong>${answered}</strong><span>Answered</span></div><div class="modal-stat"><strong>${unanswered}</strong><span>Unanswered</span></div><div class="modal-stat"><strong>${currentActive.marked.length}</strong><span>For review</span></div></div>${unanswered ? `<p style="color:var(--amber)">You still have ${unanswered} unanswered question${unanswered === 1 ? "" : "s"}. You can return to the exam or submit now.</p>` : `<p style="color:var(--green)">All questions have been answered. You are ready to submit.</p>`}</div>
        <div class="modal-actions"><button type="button" class="btn btn-outline" data-action="close-modal">Return to exam</button><button type="button" class="btn btn-primary" data-action="submit-exam">Confirm submission ${icon("arrow-right")}</button></div>`);
    }

    function submitExam(autoSubmitted = false) {
      if (submitting || !currentActive || !currentUser) return;
      const data = examData();
      if (!data) {
        toast("Your submission could not be processed because the quiz is unavailable.", "error", "Submission failed");
        return;
      }
      submitting = true;
      clearInterval(examTimer);
      examTimer = null;
      closeModal();
      const submittedAt = Date.now();
      const attempt = calculateAttempt(currentUser, data.quiz, currentActive.responses, currentActive.startedAt, submittedAt, autoSubmitted);
      db.attempts.push(attempt);
      try {
        saveDB();
      } catch (error) {
        db.attempts = db.attempts.filter(item => item.id !== attempt.id);
        submitting = false;
        openModal(`
          ${modalHeader("Submission failed")}
          <div class="modal-body"><div class="modal-icon danger">${icon("alert-triangle")}</div><p>Your answers could not be saved. Please check your browser storage and try again. Your active examination has been preserved.</p></div>
          <div class="modal-actions"><button type="button" class="btn btn-primary" data-action="retry-submit">Retry submission</button></div>`);
        return;
      }
      clearActive();
      currentActive = null;
      submitting = false;
      state.lastResultId = attempt.id;
      state.view = "result";
      renderApp();
      window.scrollTo(0, 0);
      if (autoSubmitted) toast("Time expired. Your saved answers were submitted automatically.", "warning", "Exam auto-submitted");
      else toast("Your answers have been saved and evaluated.", "success", "Examination completed");
    }

    function latestResult() {
      let attempt = getAttempt(state.lastResultId);
      if (!canReview(attempt)) attempt = userAttempts()[0];
      return attempt;
    }

    function renderResult() {
      const attempt = latestResult();
      if (!canReview(attempt)) {
        return `<div class="card empty-state"><div class="empty-icon">${icon("award")}</div><h3>No result available</h3><p>Complete an examination to see your score and answer breakdown.</p><button type="button" class="btn btn-primary" data-action="navigate" data-page="browse">Browse quizzes</button></div>`;
      }
      state.lastResultId = attempt.id;
      const quiz = attempt.quizSnapshot;
      const total = quiz.questions.length;
      const title = attempt.percentage >= 90 ? "Outstanding work!" : attempt.passed ? "Well done, you passed!" : "Keep practicing.";
      const message = attempt.passed ? "You have successfully completed this examination. Review your answers to reinforce what you have learned." : "You did not reach the passing score this time. Review the explanations and try again when you are ready.";
      return `
        <div class="result-wrap">
          <div class="breadcrumb"><button type="button" data-action="navigate" data-page="dashboard">${icon("arrow-left")} Dashboard</button>${icon("chevron-right")}<span>Examination result</span></div>
          <section class="card result-hero">
            <div class="score-ring" style="--score:${Math.min(100, attempt.percentage)};--ring-color:${attempt.passed ? "#129c68" : "#dc4446"}"><div class="score-ring-content"><strong>${attempt.percentage}%</strong><span>${formatNumber(attempt.score)} / ${formatNumber(attempt.totalMarks)} marks</span></div></div>
            <div class="result-copy"><div class="eyebrow">${attempt.autoSubmitted ? "Auto-submitted examination" : "Examination completed"}</div><h1>${title}</h1><p>${message}</p><div class="result-quiz-name">${esc(attempt.quizTitle)} · ${formatDate(attempt.submittedAt, true)}</div></div>
            <div class="result-actions"><button type="button" class="btn btn-primary" data-action="review-attempt" data-id="${attempt.id}">${icon("eye")} Review answers</button><button type="button" class="btn btn-outline" data-action="download-result" data-id="${attempt.id}">${icon("download")} Download report</button><button type="button" class="btn btn-ghost" data-action="navigate" data-page="dashboard">Back to dashboard</button></div>
          </section>
          <section class="result-stats">
            <div class="card result-stat"><div class="result-stat-icon" style="background:var(--green-soft);color:var(--green)">${icon("check-circle-2")}</div><div><strong>${attempt.correctCount}</strong><span>Correct answers</span></div></div>
            <div class="card result-stat"><div class="result-stat-icon" style="background:var(--red-soft);color:var(--red)">${icon("x-circle")}</div><div><strong>${attempt.incorrectCount}</strong><span>Incorrect answers</span></div></div>
            <div class="card result-stat"><div class="result-stat-icon" style="background:#f0f1f5;color:#667085">${icon("minus-circle")}</div><div><strong>${attempt.unanswered}</strong><span>Unanswered</span></div></div>
            <div class="card result-stat"><div class="result-stat-icon" style="background:var(--primary-soft);color:var(--primary)">${icon("clock")}</div><div><strong>${readableTime(attempt.timeUsed)}</strong><span>Time taken</span></div></div>
          </section>
          <section class="result-bottom">
            <div class="card result-detail-card"><h3>Result summary</h3><div class="detail-row"><span>Final score</span><strong>${formatNumber(attempt.score)} / ${formatNumber(attempt.totalMarks)}</strong></div><div class="detail-row"><span>Percentage</span><strong>${attempt.percentage}%</strong></div><div class="detail-row"><span>Passing requirement</span><strong>${quiz.passPercentage}%</strong></div><div class="detail-row"><span>Result status</span><span class="badge ${attempt.passed ? "badge-pass" : "badge-fail"}">${attempt.passed ? "Passed" : "Needs improvement"}</span></div><div class="detail-row"><span>Submitted on</span><strong>${formatDate(attempt.submittedAt, true)}</strong></div></div>
            <div class="card answer-breakdown"><h3>Answer breakdown</h3><div class="breakdown-bar"><span class="correct" style="width:${total ? attempt.correctCount / total * 100 : 0}%"></span><span class="incorrect" style="width:${total ? attempt.incorrectCount / total * 100 : 0}%"></span><span class="skipped" style="width:${total ? attempt.unanswered / total * 100 : 0}%"></span></div><div class="breakdown-legend"><div><i style="background:var(--green)"></i>Correct <strong>${attempt.correctCount}</strong></div><div><i style="background:var(--red)"></i>Incorrect <strong>${attempt.incorrectCount}</strong></div><div><i style="background:#d6d9e1"></i>Unanswered <strong>${attempt.unanswered}</strong></div></div><button type="button" class="btn btn-secondary w-full" style="margin-top:20px" data-action="instructions" data-id="${attempt.quizId}">${icon("rotate-ccw")} Retake this quiz</button></div>
          </section>
        </div>`;
    }

    function renderRecentResults(attempts, admin = false) {
      if (!attempts.length) {
        return `<div class="card empty-state"><div class="empty-icon">${icon("clipboard-list")}</div><h3>No examination results yet</h3><p>${admin ? "Student submissions will appear here after examinations are completed." : "Your completed examinations and scores will appear here."}</p>${admin ? "" : `<button type="button" class="btn btn-primary" data-action="navigate" data-page="browse">Take your first quiz</button>`}</div>`;
      }
      return `
        <div class="card table-card"><div class="table-responsive"><table class="data-table"><thead><tr>${admin ? "<th>Student</th>" : ""}<th>Quiz</th><th>Date</th><th>Score</th><th>Percentage</th><th>Status</th><th style="text-align:right">Action</th></tr></thead><tbody>
          ${attempts.map(attempt => `<tr>
            ${admin ? `<td><div class="table-user"><div class="avatar">${initials(attempt.userName)}</div><div><div class="table-title">${esc(attempt.userName)}</div><div class="table-subtitle">${esc(attempt.userEmail)}</div></div></div></td>` : ""}
            <td><div class="table-title">${esc(attempt.quizTitle)}</div><div class="table-subtitle">${esc(attempt.subject)}</div></td>
            <td class="muted nowrap">${formatDate(attempt.submittedAt)}</td>
            <td class="score-cell">${formatNumber(attempt.score)} / ${formatNumber(attempt.totalMarks)}</td>
            <td>${attempt.percentage}%</td>
            <td><span class="badge ${attempt.passed ? "badge-pass" : "badge-fail"}">${attempt.passed ? "Passed" : "Not passed"}</span></td>
            <td><div class="table-actions"><button type="button" class="icon-btn" data-action="review-attempt" data-id="${attempt.id}" title="Review result" aria-label="Review result">${icon("eye")}</button></div></td>
          </tr>`).join("")}
        </tbody></table></div></div>`;
    }

    function renderResults() {
      const attempts = userAttempts();
      const average = attempts.length ? Math.round(attempts.reduce((sum, attempt) => sum + attempt.percentage, 0) / attempts.length) : 0;
      const passed = attempts.filter(attempt => attempt.passed).length;
      return `
        <div class="page-title-row"><div><h1>My examination results</h1><p>Track every submission and review your previous answers.</p></div><div class="page-actions"><button type="button" class="btn btn-primary" data-action="navigate" data-page="browse">${icon("plus")} Take another quiz</button></div></div>
        <section class="stats-grid" style="grid-template-columns:repeat(3,1fr)">
          ${statCard("clipboard-check", "purple", "Total attempts", attempts.length, "All completed examinations")}
          ${statCard("target", "green", "Average percentage", `${average}%`, "Across your results")}
          ${statCard("award", "amber", "Exams passed", passed, `${attempts.length ? Math.round(passed / attempts.length * 100) : 0}% pass rate`)}
        </section>
        ${renderRecentResults(attempts)}`;
    }

    function openReview(attemptId) {
      const attempt = getAttempt(attemptId);
      if (!canReview(attempt)) {
        return toast("You do not have permission to review this examination.", "error", "Access denied");
      }
      state.reviewAttemptId = attemptId;
      state.view = "review";
      state.notificationsOpen = false;
      renderApp();
      window.scrollTo(0, 0);
    }

    function renderReview() {
      const attempt = getAttempt(state.reviewAttemptId);
      if (!canReview(attempt)) {
        return `<div class="card empty-state"><div class="empty-icon">${icon("lock-keyhole")}</div><h3>Result unavailable</h3><p>This result does not exist or you are not authorized to view it.</p><button type="button" class="btn btn-primary" data-action="navigate" data-page="dashboard">Return to dashboard</button></div>`;
      }
      const quiz = attempt.quizSnapshot;
      return `
        <div class="breadcrumb"><button type="button" data-action="navigate" data-page="${currentUser.role === "admin" ? "allResults" : "results"}">${icon("arrow-left")} ${currentUser.role === "admin" ? "Student results" : "My results"}</button>${icon("chevron-right")}<span>Answer review</span></div>
        <section class="card review-head"><div><h1>${esc(attempt.quizTitle)}</h1><p>${currentUser.role === "admin" ? `${esc(attempt.userName)} · ` : ""}Submitted ${formatDate(attempt.submittedAt, true)}</p></div><div class="review-summary"><div class="review-summary-item"><strong>${formatNumber(attempt.score)}/${formatNumber(attempt.totalMarks)}</strong><span>Final score</span></div><div class="review-summary-item"><strong class="${attempt.passed ? "text-green" : "text-red"}">${attempt.percentage}%</strong><span>${attempt.passed ? "Passed" : "Not passed"}</span></div><button type="button" class="btn btn-outline btn-sm" data-action="download-result" data-id="${attempt.id}">${icon("download")} Report</button></div></section>
        <div style="max-width:920px;margin:0 auto">
          ${quiz.questions.map((question, index) => {
            const selected = attempt.responses[question.id];
            const answered = selected !== undefined;
            const correct = selected === question.correct;
            const earned = correct ? question.marks : 0;
            return `<article class="card review-question">
              <div class="review-question-top"><h3><span class="text-primary" style="margin-right:8px">Q${index + 1}.</span>${esc(question.text)}</h3><span class="badge ${correct ? "badge-pass" : answered ? "badge-fail" : "badge-draft"}">${formatNumber(earned)}/${formatNumber(question.marks)} marks</span></div>
              <div class="review-options">${question.options.map((option, optionIndex) => {
                const isCorrect = optionIndex === question.correct;
                const isWrongSelection = answered && optionIndex === selected && !isCorrect;
                return `<div class="review-option ${isCorrect ? "correct" : isWrongSelection ? "incorrect" : ""}"><span class="option-letter">${String.fromCharCode(65 + optionIndex)}</span><span>${esc(option)}</span>${isCorrect ? `${icon("check-circle-2")}<span class="answer-note">Correct answer</span>` : isWrongSelection ? `${icon("x-circle")}<span class="answer-note">Your answer</span>` : ""}</div>`;
              }).join("")}</div>
              ${!answered ? `<div class="unanswered-note">${icon("minus-circle")} You did not answer this question.</div>` : ""}
              ${question.explanation ? `<div class="explanation"><strong>Explanation:</strong> ${esc(question.explanation)}</div>` : ""}
            </article>`;
          }).join("")}
          <div style="display:flex;justify-content:space-between;gap:12px;margin-top:22px"><button type="button" class="btn btn-outline" data-action="navigate" data-page="${currentUser.role === "admin" ? "allResults" : "results"}">${icon("arrow-left")} Back to results</button>${currentUser.role === "student" ? `<button type="button" class="btn btn-primary" data-action="instructions" data-id="${attempt.quizId}">${icon("rotate-ccw")} Retake quiz</button>` : ""}</div>
        </div>`;
    }

    function renderAdminDashboard() {
      const students = db.users.filter(user => user.role === "student");
      const attempts = [...db.attempts].sort((a, b) => b.submittedAt - a.submittedAt);
      const average = attempts.length ? Math.round(attempts.reduce((sum, attempt) => sum + attempt.percentage, 0) / attempts.length) : 0;
      const passRate = attempts.length ? Math.round(attempts.filter(attempt => attempt.passed).length / attempts.length * 100) : 0;
      return `
        <div class="welcome-row"><div><h1>Welcome, ${esc(currentUser.name)}.</h1><p>Manage assessments and monitor student performance.</p></div><div class="date-chip">${icon("calendar")} ${formatDate(Date.now())}</div></div>
        <section class="admin-hero"><div><h1>Your examination control center</h1><p>Create meaningful assessments, manage question banks and review every submission.</p></div><button type="button" class="btn" data-action="create-quiz">${icon("plus")} Create new quiz</button></section>
        <section class="stats-grid">
          ${statCard("users", "purple", "Registered students", students.length, "Student accounts")}
          ${statCard("library", "blue", "Published quizzes", publishedQuizzes().length, `${db.quizzes.length} total in library`)}
          ${statCard("file-check-2", "green", "Exam submissions", attempts.length, `${passRate}% overall pass rate`)}
          ${statCard("target", "amber", "Average score", `${average}%`, "Across all students")}
        </section>
        <section class="admin-quick-grid">
          <button type="button" class="card quick-action-card" data-action="create-quiz"><span class="stat-icon purple">${icon("file-plus-2")}</span><span><strong>Build a new assessment</strong><p>Add questions, options, marks and a time limit.</p></span>${icon("arrow-right")}</button>
          <button type="button" class="card quick-action-card" data-action="navigate" data-page="manage"><span class="stat-icon green">${icon("settings-2")}</span><span><strong>Manage quiz library</strong><p>Edit, publish or remove existing quizzes.</p></span>${icon("arrow-right")}</button>
        </section>
        <div class="section-head"><div><h2>Recent student submissions</h2><p>The latest completed examinations across your quiz library.</p></div><button type="button" class="section-link" data-action="navigate" data-page="allResults">View all results ${icon("arrow-right")}</button></div>
        ${renderRecentResults(attempts.slice(0, 6), true)}`;
    }

    function managedQuizzes() {
      const search = state.manageSearch.trim().toLowerCase();
      return db.quizzes.filter(quiz => !search || [quiz.title, quiz.subject, quiz.category].some(value => value.toLowerCase().includes(search)));
    }

    function renderManageList() {
      const quizzes = managedQuizzes();
      if (!quizzes.length) {
        return `<div class="empty-state"><div class="empty-icon">${icon("search-x")}</div><h3>No quizzes found</h3><p>Try another search or create a new assessment.</p><button type="button" class="btn btn-primary" data-action="create-quiz">${icon("plus")} Create quiz</button></div>`;
      }
      return `<div class="table-responsive"><table class="data-table"><thead><tr><th>Quiz</th><th>Difficulty</th><th>Questions</th><th>Duration</th><th>Attempts</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead><tbody>${quizzes.map(quiz => {
        const count = db.attempts.filter(attempt => attempt.quizId === quiz.id).length;
        return `<tr><td><div class="table-title">${esc(quiz.title)}</div><div class="table-subtitle">${esc(quiz.subject)} · ${esc(quiz.category)}</div></td><td><span class="badge badge-${quiz.difficulty.toLowerCase()}">${esc(quiz.difficulty)}</span></td><td>${quiz.questions.length} · ${formatNumber(quiz.totalMarks)} marks</td><td>${quiz.duration} min</td><td>${count}</td><td><button type="button" class="status-toggle" data-action="toggle-status" data-id="${quiz.id}" title="Change publication status"><span class="badge badge-${quiz.status}">${quiz.status === "published" ? "Published" : "Draft"}</span></button></td><td><div class="table-actions"><button type="button" class="icon-btn" data-action="edit-quiz" data-id="${quiz.id}" title="Edit quiz" aria-label="Edit quiz">${icon("pencil")}</button><button type="button" class="icon-btn danger" data-action="delete-quiz" data-id="${quiz.id}" title="Delete quiz" aria-label="Delete quiz">${icon("trash-2")}</button></div></td></tr>`;
      }).join("")}</tbody></table></div>`;
    }

    function renderManage() {
      return `
        <div class="page-title-row"><div><h1>Quiz management</h1><p>Create, edit, publish and organize your assessment library.</p></div><div class="page-actions"><button type="button" class="btn btn-primary" data-action="create-quiz">${icon("plus")} Create quiz</button></div></div>
        <section class="card table-card">
          <div class="admin-toolbar"><div class="filter-search">${icon("search")}<input class="input" data-manage-search value="${esc(state.manageSearch)}" placeholder="Search title, subject or category..." aria-label="Search managed quizzes"></div><span class="toolbar-count">${managedQuizzes().length} of ${db.quizzes.length} quizzes</span></div>
          <div id="manage-list">${renderManageList()}</div>
        </section>`;
    }

    function updateManageList() {
      const list = document.getElementById("manage-list");
      const count = document.querySelector(".toolbar-count");
      if (list) list.innerHTML = renderManageList();
      if (count) count.textContent = `${managedQuizzes().length} of ${db.quizzes.length} quizzes`;
      refreshIcons();
    }

    function blankQuestion() {
      return { id: uid("question"), text: "", options: ["", "", "", ""], correct: 0, marks: 1, explanation: "" };
    }

    function createQuiz() {
      if (!requireAdmin()) return;
      state.editQuizId = null;
      state.editorDraft = {
        id: null, title: "", subject: "Web Technology", category: "Core Concepts",
        difficulty: "Easy", duration: 10, passPercentage: 40, description: "",
        cover: covers.web, status: "draft", questions: [blankQuestion()]
      };
      state.view = "quizEditor";
      renderApp();
      window.scrollTo(0, 0);
    }

    function editQuiz(quizId) {
      if (!requireAdmin()) return;
      const quiz = getQuiz(quizId);
      if (!quiz) return toast("The selected quiz could not be found.", "error");
      state.editQuizId = quizId;
      state.editorDraft = clone(quiz);
      state.view = "quizEditor";
      renderApp();
      window.scrollTo(0, 0);
    }

    function renderQuizEditor() {
      const draft = state.editorDraft;
      if (!draft) return `<div class="card empty-state"><h3>Quiz editor is empty</h3><button type="button" class="btn btn-primary" data-action="create-quiz">Create a quiz</button></div>`;
      const isEdit = !!state.editQuizId;
      return `
        <form id="quiz-editor-form" novalidate>
          <div class="editor-top"><div class="editor-title"><button type="button" class="icon-btn" data-action="navigate" data-page="manage" aria-label="Back to quizzes">${icon("arrow-left")}</button><div><h1>${isEdit ? "Edit quiz" : "Create a new quiz"}</h1><p>${isEdit ? "Update quiz settings and its question bank." : "Configure the assessment and add multiple-choice questions."}</p></div></div><div class="editor-actions">${isEdit ? `<button type="button" class="btn btn-danger" data-action="delete-quiz" data-id="${state.editQuizId}">${icon("trash-2")} Delete</button>` : `<button type="button" class="btn btn-outline" data-action="navigate" data-page="manage">Cancel</button>`}<button type="submit" class="btn btn-primary">${icon("save")} ${isEdit ? "Save changes" : "Save quiz"}</button></div></div>
          <div class="editor-layout">
            <div>
              <section class="card editor-section">
                <div class="editor-section-head"><div><h2>Quiz details</h2><p>Basic information shown to students.</p></div>${icon("file-text")}</div>
                <div class="form-grid">
                  <div class="field span-2"><label>Quiz title *</label><input class="input" data-editor-field="title" value="${esc(draft.title)}" placeholder="e.g. Advanced JavaScript Assessment" required></div>
                  <div class="field"><label>Subject *</label><input class="input" data-editor-field="subject" value="${esc(draft.subject)}" list="subject-list" required><datalist id="subject-list"><option>Web Technology</option><option>Computer Science</option><option>Design</option></datalist></div>
                  <div class="field"><label>Category *</label><input class="input" data-editor-field="category" value="${esc(draft.category)}" placeholder="e.g. Programming" required></div>
                  <div class="field"><label>Difficulty</label><select class="select" data-editor-field="difficulty">${["Easy", "Medium", "Hard"].map(value => `<option ${draft.difficulty === value ? "selected" : ""}>${value}</option>`).join("")}</select></div>
                  <div class="field"><label>Duration in minutes *</label><input class="input" type="number" min="1" max="300" data-editor-field="duration" value="${esc(draft.duration)}" required></div>
                  <div class="field"><label>Passing percentage *</label><input class="input" type="number" min="1" max="100" data-editor-field="passPercentage" value="${esc(draft.passPercentage)}" required></div>
                  <div class="field"><label>Publication status</label><select class="select" data-editor-field="status"><option value="draft" ${draft.status === "draft" ? "selected" : ""}>Draft — hidden from students</option><option value="published" ${draft.status === "published" ? "selected" : ""}>Published — available to students</option></select></div>
                  <div class="field span-2"><label>Short description *</label><textarea class="textarea" data-editor-field="description" placeholder="Describe what this assessment covers..." required>${esc(draft.description)}</textarea></div>
                  <div class="field span-2"><label>Cover image URL</label><input class="input" type="url" data-editor-field="cover" value="${esc(draft.cover)}" placeholder="https://images.example.com/cover.jpg"></div>
                </div>
              </section>
              <section class="card editor-section">
                <div class="editor-section-head"><div><h2>Question bank</h2><p>Select the radio button beside the correct option.</p></div><button type="button" class="btn btn-secondary btn-sm" data-action="add-question">${icon("plus")} Add question</button></div>
                <div id="question-editor-list">${draft.questions.map((question, index) => renderQuestionEditor(question, index)).join("")}</div>
                <button type="button" class="btn btn-outline w-full" data-action="add-question">${icon("plus")} Add another question</button>
              </section>
            </div>
            <aside class="editor-side">
              <section class="card publish-card"><h3>Quiz summary</h3><div class="editor-cover" style="background-image:url('${safeCover(draft.cover)}')"></div><div class="publish-summary"><div class="publish-summary-row"><span>Questions</span><strong id="editor-question-count">${draft.questions.length}</strong></div><div class="publish-summary-row"><span>Total marks</span><strong id="editor-total-marks">${formatNumber(quizTotal(draft))}</strong></div><div class="publish-summary-row"><span>Time limit</span><strong id="editor-duration">${esc(draft.duration)} min</strong></div><div class="publish-summary-row"><span>Status</span><strong id="editor-status" style="text-transform:capitalize">${esc(draft.status)}</strong></div></div><button type="submit" class="btn btn-primary w-full">${icon("save")} ${isEdit ? "Save all changes" : "Save quiz"}</button><p class="publish-note">${icon("info")}Draft quizzes and their answer keys are never shown on student dashboards.</p></section>
              <section class="card publish-card"><h3>Question guidelines</h3><div class="before-list"><div class="before-item">${icon("check-circle-2")}<span>Write clear questions with only one correct answer.</span></div><div class="before-item">${icon("check-circle-2")}<span>Complete every option and assign positive marks.</span></div><div class="before-item">${icon("check-circle-2")}<span>Add explanations to support post-exam learning.</span></div></div></section>
            </aside>
          </div>
        </form>`;
