    function renderQuestionEditor(question, index) {
      return `<article class="question-editor" data-question-card="${question.id}">
        <div class="question-editor-head"><span class="question-index-badge">${index + 1}</span><strong>Question ${index + 1}</strong><button type="button" class="icon-btn danger" data-action="remove-question" data-qid="${question.id}" title="Remove question" ${state.editorDraft.questions.length <= 1 ? "disabled" : ""}>${icon("trash-2")}</button></div>
        <div class="question-editor-body">
          <div class="field"><label>Question text *</label><textarea class="textarea" data-qfield="text" data-qid="${question.id}" placeholder="Enter the question..." required>${esc(question.text)}</textarea></div>
          <div class="option-editor-head"><span>Correct</span><span>Answer options *</span><span></span></div>
          ${question.options.map((option, optionIndex) => `<div class="option-editor-row"><input class="correct-radio" type="radio" name="correct-${question.id}" data-qcorrect="${optionIndex}" data-qid="${question.id}" ${Number(question.correct) === optionIndex ? "checked" : ""} title="Mark as correct answer" aria-label="Mark option ${optionIndex + 1} as correct"><input class="input" data-qoption="${optionIndex}" data-qid="${question.id}" value="${esc(option)}" placeholder="Option ${String.fromCharCode(65 + optionIndex)}" required><button type="button" class="icon-btn danger" data-action="remove-option" data-qid="${question.id}" data-index="${optionIndex}" title="Remove option" ${question.options.length <= 2 ? "disabled" : ""}>${icon("x")}</button></div>`).join("")}
          <button type="button" class="add-option-btn" data-action="add-option" data-qid="${question.id}" ${question.options.length >= 6 ? "disabled" : ""}>${icon("plus")} Add option</button>
          <div class="question-editor-footer"><div class="field"><label>Marks *</label><input class="input" type="number" min="0.5" step="0.5" data-qfield="marks" data-qid="${question.id}" value="${esc(question.marks)}"></div><div class="field"><label>Explanation (shown after submission)</label><textarea class="textarea" data-qfield="explanation" data-qid="${question.id}" placeholder="Explain the correct answer...">${esc(question.explanation || "")}</textarea></div></div>
        </div>
      </article>`;
    }

    function updateEditorSummary() {
      const draft = state.editorDraft;
      if (!draft) return;
      const count = document.getElementById("editor-question-count");
      const marks = document.getElementById("editor-total-marks");
      const duration = document.getElementById("editor-duration");
      const status = document.getElementById("editor-status");
      if (count) count.textContent = draft.questions.length;
      if (marks) marks.textContent = formatNumber(quizTotal(draft));
      if (duration) duration.textContent = `${draft.duration || 0} min`;
      if (status) status.textContent = draft.status;
    }

    function saveQuizFromEditor() {
      if (!requireAdmin() || !state.editorDraft) return;
      const draft = state.editorDraft;
      if (!draft.title.trim() || !draft.subject.trim() || !draft.category.trim() || !draft.description.trim()) {
        return toast("Complete the quiz title, subject, category and description.", "error", "Validation failed");
      }
      const duration = Number(draft.duration);
      const passPercentage = Number(draft.passPercentage);
      if (!Number.isFinite(duration) || duration < 1 || duration > 300) return toast("Duration must be between 1 and 300 minutes.", "error", "Invalid time limit");
      if (!Number.isFinite(passPercentage) || passPercentage < 1 || passPercentage > 100) return toast("Passing percentage must be between 1 and 100.", "error", "Invalid passing score");
      if (!draft.questions.length) return toast("Add at least one question before saving.", "error");

      for (let index = 0; index < draft.questions.length; index++) {
        const question = draft.questions[index];
        if (!question.text.trim()) return toast(`Question ${index + 1} needs question text.`, "error", "Incomplete question");
        if (question.options.length < 2 || question.options.some(option => !String(option).trim())) return toast(`Complete all answer options for question ${index + 1}.`, "error", "Incomplete options");
        if (!Number.isInteger(Number(question.correct)) || Number(question.correct) < 0 || Number(question.correct) >= question.options.length) return toast(`Select a correct answer for question ${index + 1}.`, "error");
        if (!Number.isFinite(Number(question.marks)) || Number(question.marks) <= 0) return toast(`Question ${index + 1} must have positive marks.`, "error");
      }

      const isEdit = !!state.editQuizId;
      const old = isEdit ? getQuiz(state.editQuizId) : null;
      const quiz = {
        ...clone(draft),
        id: isEdit ? state.editQuizId : uid("quiz"),
        title: draft.title.trim(), subject: draft.subject.trim(), category: draft.category.trim(),
        description: draft.description.trim(), duration, passPercentage,
        cover: draft.cover.trim() || covers.web,
        createdAt: old?.createdAt || Date.now(), updatedAt: Date.now(),
        questions: draft.questions.map(question => ({
          ...question, id: question.id || uid("question"), text: question.text.trim(),
          options: question.options.map(option => String(option).trim()),
          correct: Number(question.correct), marks: Number(question.marks),
          explanation: String(question.explanation || "").trim()
        }))
      };
      quiz.totalMarks = quizTotal(quiz);
      try {
        if (isEdit) {
          const index = db.quizzes.findIndex(item => item.id === state.editQuizId);
          if (index < 0) throw new Error("Quiz not found");
          db.quizzes[index] = quiz;
        } else {
          db.quizzes.unshift(quiz);
        }
        saveDB();
      } catch {
        return toast("The quiz could not be saved. Please try again.", "error", "Save failed");
      }
      state.editQuizId = null;
      state.editorDraft = null;
      state.view = "manage";
      renderApp();
      toast(isEdit ? "Quiz and question bank updated successfully." : "The new quiz has been added to your library.", "success", isEdit ? "Changes saved" : "Quiz created");
    }

    function confirmDeleteQuiz(quizId) {
      if (!requireAdmin()) return;
      const quiz = getQuiz(quizId);
      if (!quiz) return;
      const attemptCount = db.attempts.filter(attempt => attempt.quizId === quiz.id).length;
      openModal(`
        ${modalHeader("Delete this quiz?")}
        <div class="modal-body"><div class="modal-icon danger">${icon("trash-2")}</div><p>You are about to permanently delete <strong style="color:var(--ink)">${esc(quiz.title)}</strong> and its ${quiz.questions.length} questions.</p><p>${attemptCount ? `${attemptCount} previous student result${attemptCount === 1 ? " will" : "s will"} be preserved for records.` : "No student attempts are associated with this quiz."} This action cannot be undone.</p></div>
        <div class="modal-actions"><button type="button" class="btn btn-outline" data-action="close-modal">Cancel</button><button type="button" class="btn btn-danger" data-action="confirm-delete-quiz" data-id="${quizId}">Delete permanently</button></div>`);
    }

    function deleteQuiz(quizId) {
      if (!requireAdmin()) return;
      const quiz = getQuiz(quizId);
      if (!quiz) return;
      db.quizzes = db.quizzes.filter(item => item.id !== quizId);
      try { saveDB(); } catch { return toast("The quiz could not be deleted.", "error"); }
      closeModal();
      if (state.editQuizId === quizId) {
        state.editQuizId = null;
        state.editorDraft = null;
      }
      state.view = "manage";
      renderApp();
      toast("The quiz was deleted. Previous student results were preserved.", "success", "Quiz deleted");
    }

    function allFilteredAttempts() {
      const search = state.resultSearch.trim().toLowerCase();
      return [...db.attempts].sort((a, b) => b.submittedAt - a.submittedAt).filter(attempt => !search || [attempt.userName, attempt.userEmail, attempt.quizTitle, attempt.subject].some(value => value.toLowerCase().includes(search)));
    }

    function renderAllResults() {
      const attempts = allFilteredAttempts();
      return `
        <div class="page-title-row"><div><h1>Student examination results</h1><p>Review submissions, scores and answer breakdowns across all quizzes.</p></div><div class="page-actions"><button type="button" class="btn btn-outline" data-action="export-results">${icon("download")} Export CSV</button></div></div>
        <section class="card table-card"><div class="admin-toolbar"><div class="filter-search">${icon("search")}<input class="input" data-result-search value="${esc(state.resultSearch)}" placeholder="Search student or quiz..." aria-label="Search results"></div><span class="toolbar-count">${attempts.length} submission${attempts.length === 1 ? "" : "s"}</span></div><div id="admin-results-list">${attempts.length ? renderRecentResults(attempts, true) : `<div class="empty-state"><div class="empty-icon">${icon("search-x")}</div><h3>No submissions found</h3><p>Try a different student name or quiz title.</p></div>`}</div></section>`;
    }

    function updateAdminResults() {
      const list = document.getElementById("admin-results-list");
      const attempts = allFilteredAttempts();
      const count = document.querySelector(".toolbar-count");
      if (list) list.innerHTML = attempts.length ? renderRecentResults(attempts, true) : `<div class="empty-state"><div class="empty-icon">${icon("search-x")}</div><h3>No submissions found</h3><p>Try a different student name or quiz title.</p></div>`;
      if (count) count.textContent = `${attempts.length} submissions`;
      refreshIcons();
    }

    function downloadResult(attemptId) {
      const attempt = getAttempt(attemptId);
      if (!canReview(attempt)) return toast("You are not authorized to download this result.", "error");
      const content = [
        "QUIZMASTER – EXAMINATION RESULT",
        "================================",
        `Student: ${attempt.userName}`,
        `Email: ${attempt.userEmail}`,
        `Quiz: ${attempt.quizTitle}`,
        `Subject: ${attempt.subject}`,
        `Submitted: ${formatDate(attempt.submittedAt, true)}`,
        `Score: ${formatNumber(attempt.score)} / ${formatNumber(attempt.totalMarks)}`,
        `Percentage: ${attempt.percentage}%`,
        `Status: ${attempt.passed ? "Passed" : "Not passed"}`,
        `Correct answers: ${attempt.correctCount}`,
        `Incorrect answers: ${attempt.incorrectCount}`,
        `Unanswered: ${attempt.unanswered}`,
        `Time used: ${readableTime(attempt.timeUsed)}`,
        "",
        "Generated by QuizMaster Online Examination System"
      ].join("\n");
      downloadBlob(content, `QuizMaster-${attempt.quizTitle.replace(/[^a-z0-9]+/gi, "-")}-result.txt`, "text/plain");
      toast("Your examination report has been downloaded.");
    }

    function downloadBlob(content, filename, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportResults() {
      if (!requireAdmin()) return;
      const rows = [["Student", "Email", "Quiz", "Subject", "Submitted", "Score", "Total marks", "Percentage", "Status", "Time used (seconds)"]];
      allFilteredAttempts().forEach(attempt => rows.push([
        attempt.userName, attempt.userEmail, attempt.quizTitle, attempt.subject,
        new Date(attempt.submittedAt).toISOString(), attempt.score, attempt.totalMarks,
        attempt.percentage, attempt.passed ? "Passed" : "Not passed", attempt.timeUsed
      ]));
      const csv = rows.map(row => row.map(value => `"${String(value).replace(/"/g, '""')}"`).join(",")).join("\n");
      downloadBlob(csv, `QuizMaster-results-${new Date().toISOString().slice(0, 10)}.csv`, "text/csv;charset=utf-8");
      toast("The filtered examination results have been exported.");
    }

    function openHelp() {
      openModal(`
        ${modalHeader("Examination guide")}
        <div class="modal-body"><p>QuizMaster keeps examinations straightforward on desktop and mobile. Here is what to expect:</p><div class="help-grid"><div class="help-item">${icon("list-checks")}<strong>Navigate freely</strong><p>Use Previous, Next or the question palette. Keyboard number keys select options.</p></div><div class="help-item">${icon("timer")}<strong>Watch the timer</strong><p>The exam submits automatically at zero, even if you have unanswered questions.</p></div><div class="help-item">${icon("flag")}<strong>Mark for review</strong><p>Flag difficult questions and return to them before final submission.</p></div><div class="help-item">${icon("shield-check")}<strong>Protected results</strong><p>Scores are calculated on submission. Answer keys appear only in your completed review.</p></div></div><p style="margin-top:16px"><strong style="color:var(--ink)">Demo accounts</strong><br>Student: student@quizmaster.com / Student@123<br>Admin: admin@quizmaster.com / Admin@123</p></div>
        <div class="modal-actions"><button type="button" class="btn btn-primary" data-action="close-modal">Got it</button></div>`, true);
    }

    document.addEventListener("click", async event => {
      const element = event.target.closest("[data-action]");
      if (!element) return;
      const action = element.dataset.action;
      if (action === "close-modal" && element.classList.contains("modal-backdrop") && event.target !== element) return;

      switch (action) {
        case "auth-tab":
          state.authMode = element.dataset.mode;
          renderAuth();
          break;
        case "toggle-password": {
          const input = element.parentElement.querySelector("input");
          input.type = input.type === "password" ? "text" : "password";
          element.innerHTML = icon(input.type === "password" ? "eye" : "eye-off");
          refreshIcons();
          break;
        }
        case "demo-login":
          element.disabled = true;
          try {
            await loginUser(element.dataset.role === "admin" ? "admin@quizmaster.com" : "student@quizmaster.com", element.dataset.role === "admin" ? "Admin@123" : "Student@123");
          } catch (error) {
            showAuthError(error.message);
            element.disabled = false;
          }
          break;
        case "logout":
          clearInterval(examTimer);
          currentActive = null;
          sessionStorage.removeItem(EXAM_FLAG);
          currentUser = null;
          saveSession();
          state.view = "dashboard";
          state.authMode = "login";
          state.notificationsOpen = false;
          closeModal();
          renderAuth();
          break;
        case "navigate": navigate(element.dataset.page); break;
        case "mobile-menu":
          state.sidebarOpen = !state.sidebarOpen;
          document.querySelector(".app-shell")?.classList.toggle("sidebar-open", state.sidebarOpen);
          break;
        case "close-sidebar":
          state.sidebarOpen = false;
          document.querySelector(".app-shell")?.classList.remove("sidebar-open");
          break;
        case "toggle-notifications":
          state.notificationsOpen = !state.notificationsOpen;
          renderApp();
          break;
        case "mark-notifications-read":
          currentUser.notificationsReadAt = Date.now();
          saveDB();
          state.notificationsOpen = false;
          renderApp();
          break;
        case "open-notification": openReview(element.dataset.id); break;
        case "open-help": openHelp(); break;
        case "close-modal": closeModal(); break;
        case "instructions": openInstructions(element.dataset.id); break;
        case "set-subject":
          state.filters.subject = element.dataset.subject;
          renderApp();
          break;
        case "clear-filters":
          state.filters = { search: "", subject: "All", difficulty: "All", category: "All" };
          renderApp();
          break;
        case "start-exam": {
          const checkbox = document.getElementById("instructions-check");
          if (!checkbox?.checked) return toast("Please confirm that you have read the instructions.", "warning");
          beginExam(element.dataset.id);
          break;
        }
        case "resume-exam": resumeExam(); break;
        case "discard-and-start":
          clearActive();
          currentActive = null;
          closeModal();
          beginExam(element.dataset.id);
          break;
        case "exit-exam":
          openModal(`${modalHeader("Save and exit exam?")}<div class="modal-body"><div class="modal-icon warning">${icon("timer")}</div><p>Your selected answers will be saved so you can resume later. <strong style="color:var(--ink)">The examination timer will continue running.</strong></p></div><div class="modal-actions"><button type="button" class="btn btn-outline" data-action="close-modal">Continue exam</button><button type="button" class="btn btn-primary" data-action="confirm-exit">Save & exit</button></div>`);
          break;
        case "confirm-exit":
          saveActive();
          clearInterval(examTimer);
          examTimer = null;
          sessionStorage.removeItem(EXAM_FLAG);
          currentActive = null;
          closeModal();
          state.view = "dashboard";
          renderApp();
          toast("Your answers are saved. Resume before the timer expires.", "warning", "Exam paused, timer active");
          break;
        case "select-option": selectOption(Number(element.dataset.index)); break;
        case "prev-question": goToQuestion(currentActive.current - 1); break;
        case "next-question": goToQuestion(currentActive.current + 1); break;
        case "jump-question": goToQuestion(Number(element.dataset.index)); break;
        case "toggle-review": {
          const data = examData();
          if (!data) break;
          const id = data.questions[currentActive.current].id;
          currentActive.marked = currentActive.marked.includes(id) ? currentActive.marked.filter(item => item !== id) : [...currentActive.marked, id];
          saveActive();
          renderExam();
          break;
        }
        case "clear-answer": {
          const data = examData();
          if (!data) break;
          delete currentActive.responses[data.questions[currentActive.current].id];
          saveActive();
          renderExam();
          break;
        }
        case "confirm-submit": confirmSubmitExam(); break;
        case "submit-exam": submitExam(false); break;
        case "retry-submit":
          closeModal();
          submitExam(currentActive ? currentActive.endTime <= Date.now() : false);
          break;
        case "review-attempt": openReview(element.dataset.id); break;
        case "download-result": downloadResult(element.dataset.id); break;
        case "create-quiz": createQuiz(); break;
        case "edit-quiz": editQuiz(element.dataset.id); break;
        case "delete-quiz": confirmDeleteQuiz(element.dataset.id); break;
        case "confirm-delete-quiz": deleteQuiz(element.dataset.id); break;
        case "toggle-status": {
          if (!requireAdmin()) break;
          const quiz = getQuiz(element.dataset.id);
          if (!quiz) break;
          quiz.status = quiz.status === "published" ? "draft" : "published";
          quiz.updatedAt = Date.now();
          saveDB();
          renderApp();
          toast(quiz.status === "published" ? "Students can now access this quiz." : "The quiz is now hidden from students.", "success", quiz.status === "published" ? "Quiz published" : "Moved to draft");
          break;
        }
        case "add-question":
          if (!state.editorDraft) break;
          state.editorDraft.questions.push(blankQuestion());
          renderApp();
          setTimeout(() => document.querySelector(`[data-question-card="${state.editorDraft.questions.at(-1).id}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" }), 50);
          break;
        case "remove-question": {
          if (!state.editorDraft || state.editorDraft.questions.length <= 1) break;
          state.editorDraft.questions = state.editorDraft.questions.filter(question => question.id !== element.dataset.qid);
          renderApp();
          toast("Question removed from this draft.", "success");
          break;
        }
        case "add-option": {
          const question = state.editorDraft?.questions.find(item => item.id === element.dataset.qid);
          if (!question || question.options.length >= 6) break;
          question.options.push("");
          renderApp();
          setTimeout(() => document.querySelector(`[data-qid="${question.id}"][data-qoption="${question.options.length - 1}"]`)?.focus(), 30);
          break;
        }
        case "remove-option": {
          const question = state.editorDraft?.questions.find(item => item.id === element.dataset.qid);
          if (!question || question.options.length <= 2) break;
          const index = Number(element.dataset.index);
          question.options.splice(index, 1);
          if (Number(question.correct) === index) question.correct = 0;
          else if (Number(question.correct) > index) question.correct = Number(question.correct) - 1;
          renderApp();
          break;
        }
        case "export-results": exportResults(); break;
      }
    });

    document.addEventListener("input", event => {
      const target = event.target;
      if (target.matches("[data-quiz-search]")) {
        state.filters.search = target.value;
        updateQuizGrid();
      }
      if (target.matches("[data-manage-search]")) {
        state.manageSearch = target.value;
        updateManageList();
      }
      if (target.matches("[data-result-search]")) {
        state.resultSearch = target.value;
        updateAdminResults();
      }
      if (target.matches("[data-editor-field]") && state.editorDraft) {
        state.editorDraft[target.dataset.editorField] = target.value;
        updateEditorSummary();
      }
      if (target.matches("[data-qfield]") && state.editorDraft) {
        const question = state.editorDraft.questions.find(item => item.id === target.dataset.qid);
        if (question) {
          question[target.dataset.qfield] = target.value;
          updateEditorSummary();
        }
      }
      if (target.matches("[data-qoption]") && state.editorDraft) {
        const question = state.editorDraft.questions.find(item => item.id === target.dataset.qid);
        if (question) question.options[Number(target.dataset.qoption)] = target.value;
      }
    });

    document.addEventListener("change", event => {
      const target = event.target;
      if (target.matches("[data-filter]")) {
        state.filters[target.dataset.filter] = target.value;
        updateQuizGrid();
      }
      if (target.id === "instructions-check") {
        const button = document.getElementById("start-exam-btn");
        if (button) button.disabled = !target.checked;
      }
      if (target.matches("[data-qcorrect]") && state.editorDraft) {
        const question = state.editorDraft.questions.find(item => item.id === target.dataset.qid);
        if (question) question.correct = Number(target.dataset.qcorrect);
      }
      if (target.matches("select[data-editor-field]") && state.editorDraft) {
        state.editorDraft[target.dataset.editorField] = target.value;
        updateEditorSummary();
      }
    });

    document.addEventListener("submit", async event => {
      event.preventDefault();
      const form = event.target;
      if (form.id === "login-form") {
        clearAuthError();
        const data = new FormData(form);
        const email = String(data.get("email") || "").trim();
        const password = String(data.get("password") || "");
        if (!email || !password) return showAuthError("Enter your email address and password.");
        const button = form.querySelector("button[type=submit]");
        button.disabled = true;
        button.textContent = "Signing in...";
        try { await loginUser(email, password); }
        catch (error) {
          showAuthError(error.message);
          button.disabled = false;
          button.innerHTML = `Sign in ${icon("arrow-right")}`;
          refreshIcons();
        }
      }
      if (form.id === "register-form") {
        clearAuthError();
        const data = new FormData(form);
        const name = String(data.get("name") || "").trim();
        const email = String(data.get("email") || "").trim().toLowerCase();
        const password = String(data.get("password") || "");
        const confirm = String(data.get("confirm") || "");
        if (name.length < 2) return showAuthError("Enter your full name.");
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showAuthError("Enter a valid email address.");
        if (password.length < 8 || !/[A-Za-z]/.test(password) || !/\d/.test(password)) return showAuthError("Password must be at least 8 characters and include a letter and a number.");
        if (password !== confirm) return showAuthError("The passwords do not match.");
        if (!data.get("terms")) return showAuthError("Please accept the examination rules to continue.");
        if (db.users.some(user => user.email === email)) return showAuthError("An account with this email address already exists.");
        const button = form.querySelector("button[type=submit]");
        button.disabled = true;
        button.textContent = "Creating your account...";
        try {
          const salt = randomSalt();
          const user = {
            id: uid("user"), name, email, role: "student", salt,
            passwordHash: await hashPassword(password, salt),
            createdAt: Date.now(), notificationsReadAt: Date.now()
          };
          db.users.push(user);
          saveDB();
          currentUser = user;
          saveSession();
          state.view = "dashboard";
          renderApp();
          toast("Your student account is ready. Welcome to QuizMaster!", "success", "Account created");
        } catch {
          showAuthError("Your account could not be created. Please try again.");
          button.disabled = false;
          button.textContent = "Create student account";
        }
      }
      if (form.id === "global-search-form") {
        const search = String(new FormData(form).get("search") || "");
        if (currentUser.role === "admin") {
          state.manageSearch = search;
          navigate("manage");
        } else {
          state.filters.search = search;
          state.filters.subject = "All";
          navigate("browse");
        }
      }
      if (form.id === "quiz-editor-form") saveQuizFromEditor();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && modalRoot.innerHTML) {
        closeModal();
        return;
      }
      if (state.view !== "exam" || !currentActive || modalRoot.innerHTML || event.ctrlKey || event.metaKey || event.altKey) return;
      if (["INPUT", "TEXTAREA", "SELECT"].includes(event.target.tagName)) return;
      const data = examData();
      if (!data) return;
      if (/^[1-6]$/.test(event.key)) {
        const index = Number(event.key) - 1;
        if (index < data.questions[currentActive.current].options.length) {
          event.preventDefault();
          selectOption(index);
        }
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        goToQuestion(currentActive.current + 1);
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        goToQuestion(currentActive.current - 1);
      } else if (event.key.toLowerCase() === "m") {
        event.preventDefault();
        document.querySelector('[data-action="toggle-review"]')?.click();
      }
    });

    window.addEventListener("beforeunload", event => {
      if (state.view === "exam" && currentActive) {
        saveActive();
        event.preventDefault();
        event.returnValue = "";
      }
    });

    async function init() {
      try {
        db = await initializeDatabase();
        const sessionId = localStorage.getItem(SESSION_KEY);
        currentUser = db.users.find(user => user.id === sessionId) || null;
        if (!currentUser) {
          renderAuth();
          return;
        }
        const active = loadActive();
        if (active && active.endTime <= Date.now()) {
          currentActive = active;
          state.view = "exam";
          submitExam(true);
          return;
        }
        if (active && sessionStorage.getItem(EXAM_FLAG) === currentUser.id) {
          currentActive = active;
          state.view = "exam";
          renderExam();
          startExamTimer();
          return;
        }
        state.view = "dashboard";
        renderApp();
      } catch (error) {
        app.innerHTML = `<div class="loading-screen"><div class="card empty-state" style="max-width:460px"><div class="empty-icon">${icon("alert-triangle")}</div><h3>QuizMaster could not start</h3><p>Please enable browser storage and reload the page. Your examination data requires local storage in this workspace.</p><button type="button" class="btn btn-primary" onclick="location.reload()">Reload application</button></div></div>`;
        refreshIcons();
      }
    }

    init();
  </script>
</body>
</html>
