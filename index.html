<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5848d8">
  <title>QuizMaster – Online Examination System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --primary:#5b50d6;
      --primary-dark:#473bb9;
      --primary-soft:#efedff;
      --ink:#172033;
      --muted:#697386;
      --subtle:#98a2b3;
      --bg:#f6f7fb;
      --surface:#ffffff;
      --line:#e7e9f0;
      --green:#129c68;
      --green-soft:#eaf9f2;
      --red:#dc4446;
      --red-soft:#fff0f0;
      --amber:#d98214;
      --amber-soft:#fff7e8;
      --navy:#151b34;
      --sidebar:248px;
      --shadow:0 8px 30px rgba(24,32,56,.06);
      --shadow-lg:0 24px 70px rgba(24,32,56,.16);
      --radius:16px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.5}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    h1,h2,h3,h4,p{margin-top:0}
    h1,h2,h3,h4,.brand-name{font-family:"Plus Jakarta Sans",sans-serif}
    svg.lucide{width:19px;height:19px;stroke-width:2;flex:none}
    ::selection{background:#dcd7ff;color:#33278b}
    :focus-visible{outline:3px solid rgba(91,80,214,.24);outline-offset:2px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .muted{color:var(--muted)}
    .subtle{color:var(--subtle)}
    .text-green{color:var(--green)}
    .text-red{color:var(--red)}
    .text-primary{color:var(--primary)}
    .small{font-size:13px}
    .tiny{font-size:12px}
    .bold{font-weight:700}
    .nowrap{white-space:nowrap}
    .w-full{width:100%}
    .hide{display:none!important}
    .loading-screen{min-height:100vh;display:grid;place-items:center;background:#f8f8fc}
    .loading-brand{display:flex;flex-direction:column;align-items:center;gap:18px;font-family:"Plus Jakarta Sans";font-weight:700}
    .spinner{width:38px;height:38px;border:3px solid #e5e2fa;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
    @keyframes pulse{50%{opacity:.55}}

    /* Shared controls */
    .btn{border:0;border-radius:10px;min-height:42px;padding:10px 17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;transition:transform .18s,background .18s,box-shadow .18s,border-color .18s;white-space:nowrap}
    .btn:hover:not(:disabled){transform:translateY(-1px)}
    .btn-primary{background:var(--primary);color:white;box-shadow:0 5px 14px rgba(91,80,214,.2)}
    .btn-primary:hover:not(:disabled){background:var(--primary-dark);box-shadow:0 8px 20px rgba(91,80,214,.26)}
    .btn-secondary{background:var(--primary-soft);color:var(--primary)}
    .btn-secondary:hover:not(:disabled){background:#e3dfff}
    .btn-outline{background:#fff;color:var(--ink);border:1px solid var(--line)}
    .btn-outline:hover:not(:disabled){border-color:#c9c4f2;background:#fafaff}
    .btn-ghost{background:transparent;color:var(--muted)}
    .btn-ghost:hover:not(:disabled){background:#f0f1f6;color:var(--ink)}
    .btn-danger{background:var(--red-soft);color:var(--red)}
    .btn-danger:hover:not(:disabled){background:#ffe2e2}
    .btn-success{background:var(--green);color:#fff}
    .btn-dark{background:var(--navy);color:#fff}
    .btn-lg{min-height:50px;padding:13px 23px;border-radius:12px;font-size:15px}
    .btn-sm{min-height:34px;padding:7px 12px;font-size:13px;border-radius:8px}
    .icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;display:inline-grid;place-items:center;color:var(--muted);transition:.18s;padding:0}
    .icon-btn:hover{color:var(--primary);border-color:#cfc9f5;background:#faf9ff}
    .icon-btn.danger:hover{color:var(--red);border-color:#ffc9c9;background:var(--red-soft)}
    .field{margin-bottom:18px}
    .field label,.field-label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#344054}
    .input,.select,.textarea{width:100%;border:1px solid #dfe2ea;background:#fff;color:var(--ink);border-radius:10px;padding:11px 13px;min-height:44px;outline:0;transition:border .18s,box-shadow .18s}
    .textarea{resize:vertical;min-height:90px}
    .input:focus,.select:focus,.textarea:focus{border-color:#9d94e8;box-shadow:0 0 0 4px rgba(91,80,214,.09)}
    .input::placeholder,.textarea::placeholder{color:#a3aaba}
    .input-wrap{position:relative}
    .input-wrap>.lucide{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#8a93a5;width:18px}
    .input-wrap>.input{padding-left:41px}
    .input-wrap>.input-action{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;border-radius:7px}
    .input-wrap>.input-action:hover{background:#f1f1f7;color:var(--primary)}
    .checkbox-row{display:flex;align-items:flex-start;gap:10px;color:var(--muted);font-size:13px}
    .checkbox-row input{width:17px;height:17px;margin:2px 0 0;accent-color:var(--primary);flex:none}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
    .form-grid .span-2{grid-column:1/-1}
    .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;line-height:1.4;white-space:nowrap}
    .badge-easy{background:var(--green-soft);color:var(--green)}
    .badge-medium{background:var(--amber-soft);color:var(--amber)}
    .badge-hard{background:var(--red-soft);color:var(--red)}
    .badge-published{background:var(--green-soft);color:var(--green)}
    .badge-draft{background:#f0f1f5;color:#667085}
    .badge-pass{background:var(--green-soft);color:var(--green)}
    .badge-fail{background:var(--red-soft);color:var(--red)}
    .badge-neutral{background:var(--primary-soft);color:var(--primary)}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 2px 5px rgba(24,32,56,.02)}
    .section-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:17px}
    .section-head h2{font-size:18px;margin:0;letter-spacing:-.02em}
    .section-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
    .section-link{border:0;background:transparent;color:var(--primary);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:5px;padding:5px}
    .section-link:hover{color:var(--primary-dark)}
    .avatar{width:39px;height:39px;border-radius:11px;background:linear-gradient(145deg,#7368e4,#4a3db6);color:#fff;display:grid;place-items:center;font-family:"Plus Jakarta Sans";font-size:12px;font-weight:800;flex:none}
    .avatar.large{width:48px;height:48px;border-radius:13px;font-size:14px}
    .empty-state{text-align:center;padding:48px 24px;color:var(--muted)}
    .empty-icon{width:62px;height:62px;border-radius:18px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin:0 auto 17px}
    .empty-icon .lucide{width:28px;height:28px}
    .empty-state h3{color:var(--ink);font-size:17px;margin-bottom:7px}
    .empty-state p{max-width:390px;margin:0 auto 20px;font-size:14px}

    /* Authentication */
    .auth-shell{min-height:100vh;display:grid;grid-template-columns:minmax(420px,1.02fr) minmax(480px,.98fr);background:#fff}
    .auth-visual{position:relative;overflow:hidden;padding:44px 54px;background:linear-gradient(145deg,#171b38 0%,#292257 48%,#5848bd 120%);color:white;display:flex;flex-direction:column}
    .auth-visual:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);background-size:24px 24px;mask-image:linear-gradient(to bottom,black,transparent 75%)}
    .auth-orb{position:absolute;border-radius:50%;filter:blur(1px);pointer-events:none}
    .auth-orb.one{width:390px;height:390px;right:-150px;top:-130px;background:radial-gradient(circle at 35% 35%,rgba(160,146,255,.55),rgba(108,86,218,.05) 70%)}
    .auth-orb.two{width:300px;height:300px;left:-140px;bottom:-100px;border:1px solid rgba(255,255,255,.1);box-shadow:0 0 100px rgba(129,107,255,.12) inset}
    .brand{display:flex;align-items:center;gap:11px;position:relative;z-index:1}
    .brand-mark{width:39px;height:39px;border-radius:11px;background:linear-gradient(145deg,#7769ed,#5142c2);display:grid;place-items:center;color:#fff;box-shadow:0 8px 20px rgba(45,32,130,.25)}
    .brand-mark .lucide{width:22px;height:22px;stroke-width:2.5}
    .brand-name{font-size:20px;font-weight:800;letter-spacing:-.04em}
    .auth-visual .brand-mark{background:#fff;color:var(--primary)}
    .auth-visual-content{position:relative;z-index:1;margin:auto 0;max-width:540px;padding:60px 0 30px}
    .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--primary);margin-bottom:12px}
    .auth-visual .eyebrow{color:#bcb2ff}
    .auth-visual h1{font-size:clamp(34px,3.5vw,53px);line-height:1.12;letter-spacing:-.05em;margin-bottom:20px}
    .auth-visual-copy{color:#c5c5da;font-size:16px;max-width:460px;line-height:1.75}
    .auth-showcase{margin-top:40px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(12px);border-radius:18px;padding:20px;max-width:440px;box-shadow:0 24px 60px rgba(5,5,30,.2)}
    .showcase-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    .showcase-top span{font-size:12px;color:#d9d7eb}
    .showcase-live{display:flex;align-items:center;gap:6px;color:#aef0d2!important}
    .showcase-live:before{content:"";width:6px;height:6px;border-radius:50%;background:#5ee5aa;box-shadow:0 0 0 4px rgba(94,229,170,.1)}
    .showcase-question{font-family:"Plus Jakarta Sans";font-weight:600;font-size:14px;margin-bottom:14px}
    .showcase-options{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .showcase-option{padding:10px 12px;border:1px solid rgba(255,255,255,.12);border-radius:9px;font-size:12px;color:#cbc9dd;display:flex;align-items:center;gap:8px}
    .showcase-option.active{border-color:#a99cf7;background:rgba(153,136,255,.16);color:#fff}
    .option-mini{width:19px;height:19px;display:grid;place-items:center;border-radius:5px;background:rgba(255,255,255,.1);font-size:10px}
    .showcase-progress{height:4px;background:rgba(255,255,255,.1);border-radius:5px;margin-top:19px;overflow:hidden}
    .showcase-progress:after{content:"";display:block;width:68%;height:100%;background:#9f90fa;border-radius:5px}
    .auth-quote{position:relative;z-index:1;color:#acacc6;font-size:12px;display:flex;align-items:center;gap:9px}
    .auth-form-side{display:grid;place-items:center;padding:40px 60px;overflow-y:auto}
    .auth-form-wrap{width:100%;max-width:430px;animation:fadeUp .45s ease both}
    .auth-mobile-brand{display:none;margin-bottom:35px}
    .auth-heading{font-size:29px;letter-spacing:-.04em;margin-bottom:8px}
    .auth-subtitle{color:var(--muted);margin-bottom:27px}
    .auth-tabs{display:flex;padding:4px;background:#f2f3f7;border-radius:11px;margin-bottom:25px}
    .auth-tab{flex:1;border:0;background:transparent;border-radius:8px;padding:9px;color:var(--muted);font-weight:700;font-size:13px}
    .auth-tab.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(24,32,56,.07)}
    .auth-error{display:none;background:var(--red-soft);border:1px solid #ffd6d6;color:#b6383a;border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:16px}
    .auth-error.show{display:flex;align-items:center;gap:8px}
    .auth-submit{width:100%;margin-top:4px}
    .demo-divider{display:flex;align-items:center;gap:12px;color:#a0a7b5;font-size:11px;margin:23px 0 15px}
    .demo-divider:before,.demo-divider:after{content:"";height:1px;background:var(--line);flex:1}
    .demo-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .demo-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;text-align:left;display:flex;align-items:center;gap:9px;color:var(--ink);transition:.18s}
    .demo-btn:hover{border-color:#c9c3ef;background:#fbfaff}
    .demo-icon{width:31px;height:31px;border-radius:8px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
    .demo-icon .lucide{width:16px;height:16px}
    .demo-btn strong{display:block;font-size:12px}
    .demo-btn small{display:block;color:var(--muted);font-size:10px}
    .auth-terms{text-align:center;color:#98a2b3;font-size:11px;margin:20px 0 0}

    /* Application shell */
    .app-shell{min-height:100vh}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);background:#fff;border-right:1px solid var(--line);z-index:50;display:flex;flex-direction:column;padding:25px 16px 17px;transition:transform .25s}
    .sidebar .brand{padding:0 10px;margin-bottom:34px}
    .sidebar-nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#a0a7b5;font-weight:800;padding:0 12px;margin:0 0 9px}
    .sidebar-nav{display:flex;flex-direction:column;gap:5px}
    .nav-item{border:0;background:transparent;width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#667085;font-weight:600;font-size:14px;text-align:left;transition:.18s;position:relative}
    .nav-item .lucide{width:19px;height:19px}
    .nav-item:hover{background:#f6f5fb;color:var(--primary)}
    .nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:700}
    .nav-item.active:before{content:"";position:absolute;left:-16px;width:3px;height:23px;background:var(--primary);border-radius:0 3px 3px 0}
    .nav-badge{margin-left:auto;background:#e8e5ff;color:var(--primary);font-size:10px;min-width:20px;height:20px;border-radius:6px;display:grid;place-items:center}
    .sidebar-spacer{flex:1}
    .sidebar-help{background:linear-gradient(145deg,#f3f1ff,#f8f7ff);border:1px solid #e8e4ff;border-radius:13px;padding:15px;margin:20px 2px 14px}
    .sidebar-help-icon{width:31px;height:31px;background:#fff;color:var(--primary);border-radius:9px;display:grid;place-items:center;margin-bottom:10px;box-shadow:0 3px 10px rgba(70,55,160,.08)}
    .sidebar-help strong{display:block;font-family:"Plus Jakarta Sans";font-size:12px;margin-bottom:4px}
    .sidebar-help p{font-size:11px;line-height:1.5;color:var(--muted);margin-bottom:9px}
    .sidebar-help button{border:0;background:transparent;padding:0;color:var(--primary);font-size:11px;font-weight:800}
    .sidebar-user{display:flex;align-items:center;gap:10px;padding:13px 7px 2px;border-top:1px solid var(--line)}
    .sidebar-user-info{min-width:0;flex:1}
    .sidebar-user-info strong{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sidebar-user-info span{font-size:10px;color:var(--muted);text-transform:capitalize}
    .sidebar-user .icon-btn{width:32px;height:32px;border:0;background:transparent}
    .app-main{margin-left:var(--sidebar);min-height:100vh}
    .topbar{height:74px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:35}
    .topbar-left{display:flex;align-items:center;gap:13px}
    .mobile-menu{display:none}
    .topbar-title{font-family:"Plus Jakarta Sans";font-weight:700;font-size:15px}
    .topbar-search{width:300px;position:relative;margin-left:auto;margin-right:18px}
    .topbar-search .lucide{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;color:#8a93a5}
    .topbar-search input{width:100%;height:39px;border:1px solid transparent;background:#f5f6f9;border-radius:10px;padding:0 13px 0 39px;outline:0;font-size:13px}
    .topbar-search input:focus{background:#fff;border-color:#cfc9ef;box-shadow:0 0 0 3px rgba(91,80,214,.07)}
    .top-actions{display:flex;align-items:center;gap:10px;position:relative}
    .notification-btn{position:relative}
    .notification-dot{position:absolute;right:-3px;top:-4px;background:var(--red);color:#fff;border:2px solid white;border-radius:10px;min-width:17px;height:17px;font-size:9px;font-weight:800;display:grid;place-items:center;padding:0 3px}
    .top-profile{display:flex;align-items:center;gap:9px;padding-left:7px}
    .top-profile-text strong{display:block;font-size:12px}
    .top-profile-text span{display:block;font-size:10px;color:var(--muted);text-transform:capitalize}
    .notification-panel{position:absolute;right:48px;top:50px;width:350px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;z-index:70;animation:fadeUp .18s ease}
    .notification-head{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid var(--line)}
    .notification-head strong{font-family:"Plus Jakarta Sans";font-size:13px}
    .notification-head button{border:0;background:transparent;color:var(--primary);font-size:11px;font-weight:700}
    .notification-list{max-height:360px;overflow:auto}
    .notification-item{display:flex;width:100%;gap:11px;padding:14px 17px;border:0;border-bottom:1px solid #f0f1f4;background:#fff;text-align:left}
    .notification-item:hover{background:#fafaff}
    .notification-item.unread{background:#fbfaff}
    .notification-item-icon{width:34px;height:34px;border-radius:9px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
    .notification-item-icon .lucide{width:16px}
    .notification-item strong{display:block;font-size:12px;margin-bottom:2px}
    .notification-item p{font-size:11px;color:var(--muted);margin:0 0 3px;line-height:1.45}
    .notification-item time{font-size:10px;color:#a0a7b5}
    .page-content{padding:30px 34px 45px;max-width:1540px;margin:0 auto;animation:fadeUp .32s ease both}
    .page-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:25px}
    .page-title-row h1{font-size:27px;letter-spacing:-.04em;margin-bottom:5px}
    .page-title-row p{color:var(--muted);margin:0;font-size:14px}
    .page-actions{display:flex;gap:10px;align-items:center}
    .sidebar-scrim{display:none}

    /* Dashboard */
    .welcome-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:20px}
    .welcome-row h1{font-size:26px;letter-spacing:-.04em;margin-bottom:4px}
    .welcome-row p{margin:0;color:var(--muted);font-size:13px}
    .date-chip{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px}
    .dashboard-hero{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(105deg,#171c38,#292552 70%,#4a3f91);min-height:220px;color:#fff;display:grid;grid-template-columns:1.25fr .75fr;margin-bottom:23px;box-shadow:0 14px 34px rgba(25,28,63,.14)}
    .dashboard-hero:after{content:"";position:absolute;width:300px;height:300px;border:1px solid rgba(255,255,255,.08);border-radius:50%;right:12%;top:-180px;box-shadow:0 0 0 45px rgba(255,255,255,.025),0 0 0 90px rgba(255,255,255,.02)}
    .hero-copy{padding:32px 35px;position:relative;z-index:2}
    .hero-copy .eyebrow{color:#b8aff9;margin-bottom:9px}
    .hero-copy h2{font-size:25px;line-height:1.28;letter-spacing:-.035em;max-width:480px;margin-bottom:10px}
    .hero-copy p{font-size:13px;color:#c2c2d5;margin-bottom:22px;max-width:500px}
    .hero-copy .btn{background:#fff;color:#292452;box-shadow:none}
    .hero-image{position:relative;min-height:220px}
    .hero-image img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;filter:saturate(.7)}
    .hero-image:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#292552 0%,transparent 50%),linear-gradient(0deg,rgba(27,25,63,.3),transparent)}
    .hero-floating{position:absolute;right:22px;bottom:20px;z-index:2;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);color:var(--ink);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(15,15,35,.2)}
    .hero-floating-icon{width:34px;height:34px;background:var(--green-soft);color:var(--green);border-radius:9px;display:grid;place-items:center}
    .hero-floating strong{display:block;font-size:11px}
    .hero-floating span{font-size:10px;color:var(--muted)}
    .resume-strip{background:#fff8e9;border:1px solid #f5e2b8;border-radius:13px;padding:13px 17px;margin-bottom:20px;display:flex;align-items:center;gap:13px}
    .resume-icon{width:38px;height:38px;border-radius:10px;background:#fff;color:var(--amber);display:grid;place-items:center;flex:none}
    .resume-copy{flex:1}
    .resume-copy strong{display:block;font-size:13px}
    .resume-copy span{font-size:12px;color:var(--muted)}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:25px}
    .stat-card{padding:19px 20px;display:flex;align-items:flex-start;gap:14px;transition:transform .2s,box-shadow .2s}
    .stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
    .stat-icon{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none}
    .stat-icon.purple{background:var(--primary-soft);color:var(--primary)}
    .stat-icon.green{background:var(--green-soft);color:var(--green)}
    .stat-icon.amber{background:var(--amber-soft);color:var(--amber)}
    .stat-icon.blue{background:#eaf4ff;color:#3483d4}
    .stat-info{min-width:0}
    .stat-info .label{font-size:11px;color:var(--muted);margin-bottom:2px}
    .stat-value{font-family:"Plus Jakarta Sans";font-size:24px;line-height:1.3;font-weight:800;letter-spacing:-.04em}
    .stat-foot{font-size:10px;color:var(--subtle);margin-top:3px}
    .dashboard-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.7fr);gap:20px;margin-bottom:27px}
    .chart-card{padding:21px 22px;min-width:0}
    .chart-legend{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
    .chart-legend:before{content:"";width:8px;height:8px;border-radius:3px;background:var(--primary)}
    .performance-chart{width:100%;height:215px;overflow:visible}
    .mastery-card{padding:21px 22px}
    .mastery-list{display:flex;flex-direction:column;gap:19px;margin-top:22px}
    .mastery-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px}
    .mastery-top span:first-child{font-weight:600}
    .mastery-top span:last-child{color:var(--muted)}
    .progress-track{height:7px;background:#eff0f4;border-radius:8px;overflow:hidden}
    .progress-fill{height:100%;border-radius:8px;background:var(--primary);transition:width .5s}
    .progress-fill.green{background:var(--green)}
    .progress-fill.amber{background:#e7a33e}
    .dashboard-quizzes{margin-bottom:27px}

    /* Quiz cards and browse */
    .quiz-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    .quiz-card{overflow:hidden;transition:transform .22s,box-shadow .22s,border-color .22s;display:flex;flex-direction:column}
    .quiz-card:hover{transform:translateY(-4px);box-shadow:0 15px 35px rgba(30,35,65,.09);border-color:#dcd8f1}
    .quiz-cover{height:116px;background-size:cover;background-position:center;position:relative;padding:14px;display:flex;align-items:flex-start;justify-content:space-between}
    .quiz-cover:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(21,25,48,.16),rgba(21,25,48,.02));pointer-events:none}
    .quiz-cover>*{position:relative;z-index:1}
    .subject-chip{background:rgba(255,255,255,.92);backdrop-filter:blur(7px);color:#303754;padding:5px 9px;border-radius:7px;font-size:10px;font-weight:800}
    .quiz-cover .badge{box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .quiz-body{padding:18px;flex:1;display:flex;flex-direction:column}
    .quiz-category{font-size:10px;color:var(--primary);font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
    .quiz-title{font-size:16px;letter-spacing:-.025em;line-height:1.4;margin-bottom:7px}
    .quiz-description{font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .quiz-meta{display:flex;align-items:center;gap:15px;padding:12px 0;border-top:1px solid #f0f1f4;border-bottom:1px solid #f0f1f4;margin-top:auto}
    .quiz-meta span{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px;white-space:nowrap}
    .quiz-meta .lucide{width:14px;height:14px;color:#8d85cf}
    .quiz-footer{display:flex;align-items:center;justify-content:space-between;padding-top:14px;gap:10px}
    .quiz-marks{font-size:11px;color:var(--muted)}
    .quiz-marks strong{display:block;color:var(--ink);font-size:13px}
    .filter-bar{padding:16px 18px;margin-bottom:21px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .filter-search{position:relative;flex:1;min-width:210px}
    .filter-search .lucide{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#8a93a5;width:17px}
    .filter-search .input{padding-left:38px;border-color:transparent;background:#f5f6f9}
    .filter-bar .select{width:auto;min-width:140px;min-height:42px;font-size:12px;color:#4b5567}
    .subject-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
    .subject-tab{border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 14px;border-radius:9px;font-size:12px;font-weight:600;transition:.18s}
    .subject-tab:hover{border-color:#cfc9ef;color:var(--primary)}
    .subject-tab.active{background:var(--navy);border-color:var(--navy);color:#fff}
    .results-count{color:var(--muted);font-size:12px;margin-bottom:13px}

    /* Instructions */
    .breadcrumb{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;margin-bottom:19px}
    .breadcrumb button{border:0;background:transparent;padding:0;color:var(--muted);display:flex;align-items:center;gap:6px}
    .breadcrumb button:hover{color:var(--primary)}
    .instructions-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.65fr);gap:22px;align-items:start}
    .instruction-main{overflow:hidden}
    .instruction-banner{height:175px;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end;padding:25px;color:#fff}
    .instruction-banner:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(17,22,43,.93),rgba(17,22,43,.15))}
    .instruction-banner-content{position:relative;z-index:1}
    .instruction-banner h1{font-size:25px;letter-spacing:-.04em;margin:8px 0 0}
    .instruction-content{padding:25px}
    .instruction-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}
    .instruction-stat{background:#f7f7fb;border:1px solid #efeff5;border-radius:11px;padding:13px;display:flex;align-items:center;gap:10px}
    .instruction-stat .lucide{color:var(--primary);width:19px}
    .instruction-stat strong{font-size:14px;display:block;line-height:1.3}
    .instruction-stat span{font-size:10px;color:var(--muted)}
    .instruction-content h2{font-size:17px;margin-bottom:14px}
    .rules-list{list-style:none;padding:0;margin:0 0 24px;display:flex;flex-direction:column;gap:13px}
    .rules-list li{display:flex;gap:11px;color:#515c6f;font-size:13px}
    .rule-number{width:23px;height:23px;border-radius:7px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:10px;font-weight:800;flex:none;margin-top:1px}
    .instructions-agree{background:#f8f8fc;border-radius:11px;padding:14px;margin-bottom:18px}
    .instruction-side{padding:22px;position:sticky;top:96px}
    .instruction-side h3{font-size:15px;margin-bottom:17px}
    .before-list{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
    .before-item{display:flex;gap:10px;font-size:12px;color:var(--muted)}
    .before-item .lucide{color:var(--green);width:17px;margin-top:1px}
    .best-attempt{background:var(--primary-soft);border-radius:11px;padding:13px;margin-bottom:18px}
    .best-attempt span{font-size:10px;color:var(--muted)}
    .best-attempt strong{display:block;color:var(--primary);font-family:"Plus Jakarta Sans";font-size:21px}

    /* Examination */
    .exam-shell{min-height:100vh;background:#f4f5f9}
    .exam-topbar{height:75px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:0 30px;position:sticky;top:0;z-index:40}
    .exam-topbar .brand-mark{width:35px;height:35px}
    .exam-topbar .brand-name{font-size:17px}
    .exam-divider{width:1px;height:30px;background:var(--line)}
    .exam-title{min-width:0;flex:1}
    .exam-title strong{font-family:"Plus Jakarta Sans";font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .exam-title span{font-size:10px;color:var(--muted)}
    .save-state{display:flex;align-items:center;gap:6px;color:var(--green);font-size:11px}
    .save-state .lucide{width:15px}
    .exam-timer{display:flex;align-items:center;gap:9px;background:#f0effb;color:var(--primary);border:1px solid #e3e0f8;border-radius:10px;padding:8px 13px;min-width:119px;justify-content:center}
    .exam-timer .lucide{width:18px}
    .exam-timer-label{font-size:9px;display:block;line-height:1.1;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .exam-timer strong{font-family:"Plus Jakarta Sans";font-size:16px;letter-spacing:.03em;font-variant-numeric:tabular-nums}
    .exam-timer.warning{background:var(--amber-soft);color:var(--amber);border-color:#f4ddb5}
    .exam-timer.danger{background:var(--red-soft);color:var(--red);border-color:#ffd1d1;animation:pulse 1.2s infinite}
    .exam-layout{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:22px;max-width:1280px;margin:0 auto;padding:25px 28px 50px}
    .exam-main{min-width:0}
    .exam-progress-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:9px}
    .exam-progress-head strong{color:var(--ink)}
    .exam-progress{height:6px;background:#e4e5ec;border-radius:6px;overflow:hidden;margin-bottom:20px}
    .exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#8b7cf0);border-radius:6px;transition:width .25s}
    .question-card{padding:28px 30px 23px;min-height:480px;display:flex;flex-direction:column}
    .question-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:15px}
    .question-number{font-size:11px;color:var(--primary);text-transform:uppercase;letter-spacing:.1em;font-weight:800}
    .question-tools{display:flex;align-items:center;gap:9px}
    .marks-chip{font-size:10px;background:#f2f3f7;color:var(--muted);padding:5px 9px;border-radius:6px;font-weight:700}
    .review-flag{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;min-height:32px;padding:5px 10px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700}
    .review-flag .lucide{width:14px}
    .review-flag.active{background:var(--amber-soft);border-color:#f3dab0;color:var(--amber)}
    .question-text{font-family:"Plus Jakarta Sans";font-size:20px;line-height:1.55;letter-spacing:-.02em;margin-bottom:24px;color:#20293b}
    .options-list{display:flex;flex-direction:column;gap:11px}
    .option-btn{width:100%;border:1.5px solid #e4e6ec;background:#fff;border-radius:11px;padding:13px 15px;display:flex;align-items:center;gap:13px;text-align:left;color:#414b5e;transition:border .16s,background .16s,transform .16s;min-height:57px}
    .option-btn:hover{border-color:#bdb5ed;background:#fbfaff;transform:translateX(2px)}
    .option-btn.selected{border-color:var(--primary);background:#f6f4ff;color:#332b79;box-shadow:0 0 0 3px rgba(91,80,214,.06)}
    .option-letter{width:30px;height:30px;border-radius:8px;background:#f1f2f6;color:#697386;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;transition:.16s}
    .option-btn.selected .option-letter{background:var(--primary);color:#fff}
    .option-text{font-size:14px;line-height:1.45;flex:1}
    .option-check{width:19px;height:19px;border:1.5px solid #d5d8e0;border-radius:50%;display:grid;place-items:center;color:transparent;flex:none}
    .option-btn.selected .option-check{background:var(--primary);border-color:var(--primary);color:#fff}
    .option-check .lucide{width:12px;height:12px;stroke-width:3}
    .question-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:27px}
    .question-actions-right{display:flex;align-items:center;gap:9px}
    .clear-answer{border:0;background:transparent;color:var(--muted);font-size:11px;padding:8px}
    .clear-answer:hover{color:var(--red)}
    .exam-sidebar{display:flex;flex-direction:column;gap:16px;position:sticky;top:99px;align-self:start}
    .palette-card{padding:20px}
    .palette-card h3{font-size:14px;margin-bottom:4px}
    .palette-subtitle{font-size:11px;color:var(--muted);margin-bottom:16px}
    .question-palette{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px}
    .q-dot{aspect-ratio:1;border:1px solid #e0e3ea;background:#fff;color:#667085;border-radius:8px;font-size:11px;font-weight:700;position:relative;transition:.15s;padding:0}
    .q-dot:hover{border-color:#a9a0e4;color:var(--primary)}
    .q-dot.answered{background:var(--primary-soft);border-color:#d9d4fa;color:var(--primary)}
    .q-dot.marked{background:var(--amber-soft);border-color:#f1d7a7;color:var(--amber)}
    .q-dot.marked:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--amber);right:3px;top:3px}
    .q-dot.current{outline:2px solid var(--primary);outline-offset:2px;border-color:var(--primary);color:var(--primary);font-weight:800}
    .palette-legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 5px;padding-top:14px;border-top:1px solid var(--line)}
    .legend-item{display:flex;align-items:center;gap:6px;font-size:9px;color:var(--muted)}
    .legend-dot{width:10px;height:10px;border-radius:3px;border:1px solid #dfe2e8;background:#fff}
    .legend-dot.answered{background:var(--primary-soft);border-color:#d4cef8}
    .legend-dot.marked{background:var(--amber-soft);border-color:#edcf98}
    .legend-dot.current{border:2px solid var(--primary)}
    .submit-card{padding:19px}
    .submit-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
    .submit-stat{text-align:center;background:#f7f7fa;padding:9px 5px;border-radius:8px}
    .submit-stat strong{font-family:"Plus Jakarta Sans";font-size:17px;display:block}
    .submit-stat span{font-size:9px;color:var(--muted)}
    .submit-note{display:flex;align-items:flex-start;gap:6px;font-size:10px;color:var(--muted);margin:11px 0 0;line-height:1.45}
    .submit-note .lucide{width:13px;margin-top:1px;color:var(--green)}

    /* Results and review */
    .result-wrap{max-width:1050px;margin:0 auto}
    .result-hero{padding:31px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:30px;margin-bottom:20px;position:relative;overflow:hidden}
    .result-hero:after{content:"";position:absolute;width:210px;height:210px;border-radius:50%;right:-90px;top:-100px;background:var(--primary-soft);opacity:.55}
    .score-ring{--score:0;--ring-color:var(--primary);width:148px;height:148px;border-radius:50%;background:conic-gradient(var(--ring-color) calc(var(--score)*1%),#eceef3 0);display:grid;place-items:center;position:relative;flex:none}
    .score-ring:before{content:"";position:absolute;inset:11px;background:#fff;border-radius:50%}
    .score-ring-content{position:relative;text-align:center;z-index:1}
    .score-ring-content strong{display:block;font-family:"Plus Jakarta Sans";font-size:31px;line-height:1.2;letter-spacing:-.05em}
    .score-ring-content span{font-size:10px;color:var(--muted)}
    .result-copy{position:relative;z-index:1}
    .result-copy .eyebrow{margin-bottom:7px}
    .result-copy h1{font-size:25px;letter-spacing:-.04em;margin-bottom:7px}
    .result-copy p{color:var(--muted);font-size:13px;margin-bottom:10px}
    .result-quiz-name{font-weight:700;color:#3c4658;font-size:12px}
    .result-actions{display:flex;flex-direction:column;gap:9px;position:relative;z-index:1}
    .result-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
    .result-stat{padding:18px;display:flex;align-items:center;gap:12px}
    .result-stat-icon{width:39px;height:39px;border-radius:10px;display:grid;place-items:center}
    .result-stat-icon .lucide{width:18px}
    .result-stat strong{font-family:"Plus Jakarta Sans";font-size:20px;display:block;line-height:1.25}
    .result-stat span{font-size:10px;color:var(--muted)}
    .result-bottom{display:grid;grid-template-columns:1fr .8fr;gap:20px}
    .result-detail-card{padding:22px}
    .result-detail-card h3{font-size:15px;margin-bottom:17px}
    .detail-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f1f4;font-size:12px}
    .detail-row:last-child{border:0}
    .detail-row span{color:var(--muted)}
    .answer-breakdown{padding:22px}
    .answer-breakdown h3{font-size:15px;margin-bottom:19px}
    .breakdown-bar{height:12px;border-radius:8px;overflow:hidden;display:flex;background:#eee;margin-bottom:15px}
    .breakdown-bar .correct{background:var(--green)}
    .breakdown-bar .incorrect{background:var(--red)}
    .breakdown-bar .skipped{background:#d6d9e1}
    .breakdown-legend{display:flex;flex-direction:column;gap:10px}
    .breakdown-legend>div{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
    .breakdown-legend i{width:8px;height:8px;border-radius:3px}
    .breakdown-legend strong{margin-left:auto;color:var(--ink)}
    .table-card{overflow:hidden}
    .table-responsive{overflow-x:auto}
    .data-table{width:100%;border-collapse:collapse;min-width:700px}
    .data-table th{background:#fafafd;color:#858da0;text-transform:uppercase;letter-spacing:.07em;font-size:9px;font-weight:800;text-align:left;padding:12px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
    .data-table td{padding:14px 18px;border-bottom:1px solid #f0f1f4;font-size:12px;vertical-align:middle}
    .data-table tr:last-child td{border-bottom:0}
    .data-table tbody tr:hover{background:#fcfcfe}
    .table-title{font-weight:700;color:var(--ink);font-size:12px}
    .table-subtitle{font-size:10px;color:var(--muted);margin-top:2px}
    .table-user{display:flex;align-items:center;gap:9px}
    .table-user .avatar{width:31px;height:31px;border-radius:8px;font-size:9px}
    .table-actions{display:flex;gap:6px;justify-content:flex-end}
    .table-actions .icon-btn{width:32px;height:32px;border-radius:8px}
    .table-actions .lucide{width:15px;height:15px}
    .score-cell{font-family:"Plus Jakarta Sans";font-weight:800}
    .review-head{padding:22px 24px;margin-bottom:19px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .review-head h1{font-size:20px;margin-bottom:4px}
    .review-head p{font-size:12px;color:var(--muted);margin:0}
    .review-summary{display:flex;gap:20px}
    .review-summary-item{text-align:right}
    .review-summary-item strong{font-family:"Plus Jakarta Sans";font-size:19px;display:block}
    .review-summary-item span{font-size:9px;color:var(--muted)}
    .review-question{padding:24px;margin-bottom:15px}
    .review-question-top{display:flex;justify-content:space-between;gap:15px;margin-bottom:15px}
    .review-question-top h3{font-size:15px;line-height:1.55;margin:0}
    .review-options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}
    .review-option{border:1px solid var(--line);border-radius:9px;padding:11px 12px;display:flex;align-items:center;gap:9px;font-size:12px;color:#566074}
    .review-option .option-letter{width:25px;height:25px;font-size:10px}
    .review-option.correct{border-color:#a9e3ca;background:var(--green-soft);color:#147550}
    .review-option.correct .option-letter{background:var(--green);color:#fff}
    .review-option.incorrect{border-color:#f4bcbc;background:var(--red-soft);color:#a53739}
    .review-option.incorrect .option-letter{background:var(--red);color:#fff}
    .review-option .lucide{margin-left:auto;width:16px}
    .answer-note{font-size:9px;font-weight:800;display:block;margin-left:auto;white-space:nowrap}
    .explanation{margin-top:16px;background:#f7f7fb;border-left:3px solid var(--primary);padding:11px 13px;border-radius:0 8px 8px 0;font-size:11px;color:var(--muted)}
    .explanation strong{color:var(--ink)}

    /* Admin */

    .status-toggle{border:0;background:transparent;padding:0}
    .editor-top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:21px}
    .editor-title{display:flex;align-items:center;gap:13px}
    .editor-title h1{font-size:22px;margin:0 0 3px;letter-spacing:-.035em}
    .editor-title p{font-size:11px;color:var(--muted);margin:0}
    .editor-actions{display:flex;gap:9px}
    .editor-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:21px;align-items:start}
    .editor-section{padding:23px;margin-bottom:18px}

    .question-editor{border:1px solid var(--line);border-radius:13px;margin-bottom:15px;overflow:hidden}

    .question-index-badge{width:25px;height:25px;background:var(--primary-soft);color:var(--primary);border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:800}
    .question-editor-body{padding:17px}
    .option-editor-head{display:grid;grid-template-columns:28px 1fr 32px;gap:8px;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
    .option-editor-row{display:grid;grid-template-columns:28px 1fr 32px;gap:8px;align-items:center;margin-bottom:8px}
    .correct-radio{width:18px;height:18px;accent-color:var(--green);margin:0 auto;cursor:pointer}
    .option-editor-row .input{min-height:39px;padding:8px 11px;font-size:12px}

    .add-option-btn .lucide{width:14px}

    .publish-note{font-size:10px;color:var(--muted);line-height:1.55;display:flex;gap:7px;margin-top:13px}
    .publish-note .lucide{width:14px;color:var(--primary);margin-top:1px}
    .editor-cover{height:110px;border-radius:10px;background-size:cover;background-position:center;margin-bottom:15px;position:relative;overflow:hidden}
    .editor-cover:after{content:"Quiz cover preview";position:absolute;bottom:0;left:0;right:0;padding:17px 10px 8px;color:#fff;font-size:9px;background:linear-gradient(transparent,rgba(0,0,0,.65))}

    /* Modal and toast */
    .modal-backdrop{position:fixed;inset:0;background:rgba(17,23,40,.56);backdrop-filter:blur(4px);z-index:1000;display:grid;place-items:center;padding:20px;animation:fadeUp .16s ease}
    .modal{width:100%;max-width:460px;background:#fff;border-radius:17px;box-shadow:var(--shadow-lg);overflow:hidden}
    .modal.modal-wide{max-width:620px}
    .modal-header{display:flex;align-items:flex-start;justify-content:space-between;padding:21px 23px 0;gap:15px}
    .modal-header h2{font-size:19px;letter-spacing:-.03em;margin:0}
    .modal-close{width:31px;height:31px;border:0;background:#f3f4f7;color:var(--muted);border-radius:8px;display:grid;place-items:center}
    .modal-close .lucide{width:16px}

    #toast-root{position:fixed;right:22px;top:20px;z-index:1200;display:flex;flex-direction:column;gap:10px;pointer-events:none}

    .toast.error .toast-icon{background:var(--red-soft);color:var(--red)}
    .toast.warning .toast-icon{background:var(--amber-soft);color:var(--amber)}
    .toast-icon .lucide{width:16px}
    .toast-copy strong{display:block;font-size:12px;margin-bottom:1px}
    .toast-copy span{display:block;color:var(--muted);font-size:11px;line-height:1.45}
    .toast-close{margin-left:auto;border:0;background:transparent;color:#9aa2b2;padding:2px}

    /* Responsive */

      .notification-panel{position:fixed;right:12px;left:12px;top:68px;width:auto}

    @media(prefers-reduced-motion:reduce){
      *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}

    @media print{

      .sidebar,.topbar,.result-actions,.page-actions,.breadcrumb,#toast-root{display:none!important}

<body>
  <div id="app">
    <div class="loading-screen">
      <div class="loading-brand">
        <div class="brand-mark"><i data-lucide="graduation-cap"></i></div>
        <span>QuizMaster</span>
        <div class="spinner"></div>
      </div>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script>
    "use strict";

    const DB_KEY = "quizmaster_database_v4";
    const SESSION_KEY = "quizmaster_session_v4";
    const ACTIVE_PREFIX = "quizmaster_active_attempt_v4_";
    const EXAM_FLAG = "quizmaster_exam_in_progress";
    const app = document.getElementById("app");
    const modalRoot = document.getElementById("modal-root");
    const toastRoot = document.getElementById("toast-root");

    let db = null;
    let currentUser = null;
    let currentActive = null;
    let examTimer = null;
    let submitting = false;

    const state = {
      view: "dashboard",
      authMode: "login",
      selectedQuizId: null,
      lastResultId: null,
      reviewAttemptId: null,
      editQuizId: null,
      editorDraft: null,
      notificationsOpen: false,
      sidebarOpen: false,
      filters: { search: "", subject: "All", difficulty: "All", category: "All" },
      manageSearch: "",
      resultSearch: ""
    };

    const covers = {
      web: "https://images.unsplash.com/photo-1461749280684-dccba630e2f6?auto=format&fit=crop&w=1000&q=80",
      javascript: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=1000&q=80",
      python: "https://images.unsplash.com/photo-1526379095098-d400fd0bf935?auto=format&fit=crop&w=1000&q=80",
      database: "https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=1000&q=80",
      design: "https://images.unsplash.com/photo-1561070791-2526d30994b5?auto=format&fit=crop&w=1000&q=80",
      data: "https://images.unsplash.com/photo-1516116216624-53e697fedbea?auto=format&fit=crop&w=1000&q=80"
    };

    function icon(name, className = "") {
      return `<i data-lucide="${name}"${className ? ` class="${className}"` : ""}></i>`;
    }

    function refreshIcons() {
      requestAnimationFrame(() => {
        if (window.lucide) window.lucide.createIcons();
      });
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[ch]);
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function uid(prefix = "id") {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 9)}`;
    }

    function initials(name) {
      return String(name || "User").trim().split(/\s+/).slice(0, 2).map(part => part[0]).join("").toUpperCase();
    }

    function formatNumber(value) {
      const number = Number(value) || 0;
      return Number.isInteger(number) ? String(number) : number.toFixed(1);
    }

    function formatDate(date, includeTime = false) {
      if (!date) return "—";
      return new Intl.DateTimeFormat("en", includeTime
        ? { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }
        : { day: "numeric", month: "short", year: "numeric" }
      ).format(new Date(date));
    }

    function formatDuration(seconds) {
      const total = Math.max(0, Math.round(Number(seconds) || 0));
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      if (hours) return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      return `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function readableTime(seconds) {
      const total = Math.max(0, Math.round(Number(seconds) || 0));
      if (total < 60) return `${total} sec`;
      const mins = Math.floor(total / 60);
      const secs = total % 60;
      return secs ? `${mins}m ${secs}s` : `${mins} min`;
    }

    function timeAgo(date) {
      const diff = Math.max(0, Date.now() - new Date(date).getTime());
      const minutes = Math.floor(diff / 60000);
      if (minutes < 1) return "Just now";
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.floor(hours / 24);
      return days === 1 ? "Yesterday" : `${days}d ago`;
    }

    function safeCover(url) {
      return /^https:\/\//i.test(String(url || "")) ? esc(url) : esc(covers.web);
    }

    function quizTotal(quiz) {
      return (quiz.questions || []).reduce((sum, question) => sum + (Number(question.marks) || 0), 0);
    }

    function getQuiz(id) {
      return db.quizzes.find(quiz => quiz.id === id);
    }

    function getUser(id) {
      return db.users.find(user => user.id === id);
    }

    function getAttempt(id) {
      return db.attempts.find(attempt => attempt.id === id);
    }

    function userAttempts(userId = currentUser?.id) {
      return db.attempts.filter(attempt => attempt.userId === userId).sort((a, b) => b.submittedAt - a.submittedAt);
    }

    function publishedQuizzes() {
      return db.quizzes.filter(quiz => quiz.status === "published");
    }

    function saveDB() {
      localStorage.setItem(DB_KEY, JSON.stringify(db));
    }

    function saveSession() {
      if (currentUser) localStorage.setItem(SESSION_KEY, currentUser.id);
      else localStorage.removeItem(SESSION_KEY);
    }

    function activeKey(userId) {
      return ACTIVE_PREFIX + userId;
    }

    function loadActive(userId = currentUser?.id) {
      if (!userId) return null;
      try {
        const data = JSON.parse(localStorage.getItem(activeKey(userId)) || "null");
        return data && data.quizId ? data : null;
      } catch {
        return null;
      }
    }

    function saveActive() {
      if (currentActive && currentUser) {
        localStorage.setItem(activeKey(currentUser.id), JSON.stringify(currentActive));
      }
    }

    function clearActive(userId = currentUser?.id) {
      if (userId) localStorage.removeItem(activeKey(userId));
      sessionStorage.removeItem(EXAM_FLAG);
    }

    function randomSalt() {
      if (window.crypto?.getRandomValues) {
        const bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        return Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("");
      }
      return uid("salt") + uid("key");
    }

    function fallbackHash(text) {
      let first = 0x811c9dc5;
      let second = 0x9e3779b9;
      for (let i = 0; i < text.length; i++) {
        first = Math.imul(first ^ text.charCodeAt(i), 16777619);
        second = Math.imul(second ^ text.charCodeAt(i), 2246822519);
      }
      return `${(first >>> 0).toString(16).padStart(8, "0")}${(second >>> 0).toString(16).padStart(8, "0")}${text.length.toString(16)}`;
    }

    async function hashPassword(password, salt) {
      if (window.crypto?.subtle && window.TextEncoder) {
        try {
          const encoder = new TextEncoder();
          const key = await crypto.subtle.importKey("raw", encoder.encode(password), "PBKDF2", false, ["deriveBits"]);
          const bits = await crypto.subtle.deriveBits({
            name: "PBKDF2",
            salt: encoder.encode(salt),
            iterations: 60000,
            hash: "SHA-256"
          }, key, 256);
          return Array.from(new Uint8Array(bits), byte => byte.toString(16).padStart(2, "0")).join("");
        } catch {}
      }
      return fallbackHash(`${salt}:${password}`);
    }

    function calculateAttempt(user, quiz, responses, startedAt, submittedAt, autoSubmitted = false, fixedId = null) {
      const cleanResponses = {};
      let score = 0;
      let correctCount = 0;
      let incorrectCount = 0;
      let answered = 0;

      quiz.questions.forEach(question => {
        const selected = Number(responses[question.id]);
        const valid = Number.isInteger(selected) && selected >= 0 && selected < question.options.length;
        if (valid) {
          cleanResponses[question.id] = selected;
          answered++;
          if (selected === question.correct) {
            correctCount++;
            score += Number(question.marks) || 0;
          } else {
            incorrectCount++;
          }
        }
      });

      const totalMarks = quizTotal(quiz);
      const percentage = totalMarks ? Math.round((score / totalMarks) * 1000) / 10 : 0;
      const durationLimit = Number(quiz.duration) * 60;
      const timeUsed = Math.min(durationLimit, Math.max(0, Math.round((submittedAt - startedAt) / 1000)));

      return {
        id: fixedId || uid("attempt"),
        userId: user.id,
        userName: user.name,
        userEmail: user.email,
        quizId: quiz.id,
        quizTitle: quiz.title,
        subject: quiz.subject,
        startedAt,
        submittedAt,
        timeUsed,
        responses: cleanResponses,
        score: Math.round(score * 10) / 10,
        totalMarks,
        percentage,
        correctCount,
        incorrectCount,
        unanswered: quiz.questions.length - answered,
        passed: percentage >= Number(quiz.passPercentage),
        autoSubmitted,
        quizSnapshot: clone(quiz)
      };
    }

        ["attempt_seed_6", secondStudent, quizzes[4], [0, 1, 1, 0], now - 86400000 * 0.15, 220]
